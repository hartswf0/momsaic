<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#efeadd">
<meta name="description" content="Common Ground: a living map woven by the people who move through a place.">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Common Ground · Living Mapmaker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23efeadd'/%3E%3Cpath d='M4 20c6 0 6-10 12-10s6 10 12 10' fill='none' stroke='%23bf4526' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='15' r='3.2' fill='none' stroke='%231d201d' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#efeadd;
    --paper-lit:#f6f2e8;
    --ink:#1d201d;
    --ink-soft:rgba(29,32,29,.55);
    --signal:#bf4526;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
  body{
    font-family:Georgia,"Times New Roman",serif;
    overscroll-behavior:none;
    touch-action:none;
    -webkit-user-select:none;user-select:none;
  }
  #stage{position:fixed;inset:0;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}

  .pip{
    position:absolute;pointer-events:auto;display:grid;place-items:center;
    background:var(--paper-lit);border-radius:50%;
    box-shadow:inset 0 0 0 1px rgba(29,32,29,.34),0 1px 2px rgba(29,32,29,.10);
    transition:transform .16s cubic-bezier(.2,.8,.3,1),opacity .22s ease;
    cursor:pointer;
  }
  .pip svg{display:block;overflow:visible}
  .pip:active{transform:scale(.94)}

  #thread{
    width:72px;height:72px;left:50%;transform:translateX(-50%);
    bottom:calc(22px + env(safe-area-inset-bottom));
  }
  #thread:active{transform:translateX(-50%) scale(.94)}
  #thread.beat{animation:beat 1.5s ease-in-out infinite}
  #thread.beat:active{animation:none;transform:translateX(-50%) scale(.94)}
  @keyframes beat{0%,100%{transform:translateX(-50%) scale(1)}45%{transform:translateX(-50%) scale(1.07)}}
  @media (prefers-reduced-motion:reduce){#thread.beat{animation:none}}
  #thread .ring{fill:none;stroke:var(--ink);stroke-width:1.4;opacity:.85}
  #thread.on .ring{stroke:var(--paper-lit);stroke-width:1.8;opacity:.9}
  #thread .glyph{fill:none;stroke:var(--ink);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  #thread .knob{fill:var(--ink);stroke:none}

  #people{
    width:46px;height:46px;right:calc(16px + env(safe-area-inset-right));bottom:calc(35px + env(safe-area-inset-bottom));
    opacity:0;pointer-events:none;
  }
  #people.show{opacity:1;pointer-events:auto}
  #back{
    width:46px;height:46px;left:calc(16px + env(safe-area-inset-left));bottom:calc(35px + env(safe-area-inset-bottom));
    opacity:0;pointer-events:none;
  }
  #back.show{opacity:1;pointer-events:auto}
  #undo{
    width:46px;height:46px;left:50%;
    bottom:calc(35px + env(safe-area-inset-bottom));
    transform:translateX(-96px);opacity:0;pointer-events:none;
  }
  #undo.show{opacity:1;pointer-events:auto}
  #undo:active{transform:translateX(-96px) scale(.94)}

  /* place-anchored word input */
  #say{
    position:absolute;display:none;pointer-events:auto;z-index:7;
    transform:translate(-2px,-50%);
  }
  #say input{
    font:italic 17px/1.2 Georgia,"Times New Roman",serif;
    max-width:calc(100vw - 96px);
    color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--ink);
    outline:none;padding:2px 2px 4px;width:min(58vw,230px);caret-color:var(--signal);
  }
  #say input::placeholder{color:rgba(29,32,29,.32);font-style:italic}
  #say.flip{transform:translate(calc(-100% + 2px),-50%)}
  #say.flip #mic{right:auto;left:-30px}
  #mic{
    display:none;position:absolute;right:-30px;top:-2px;width:24px;height:24px;
    border-radius:50%;background:var(--paper-lit);box-shadow:0 1px 0 rgba(29,32,29,.3);
    place-items:center;cursor:pointer
  }
  #mic.on{background:var(--signal)}
  #mic.avail{display:grid}

  /* the ground key (share) */
  #key{
    position:fixed;inset:0;z-index:9;display:none;place-items:center;
    background:rgba(239,234,221,.94);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
    pointer-events:auto;
  }
  #key.show{display:grid}
  #keyInner{
    display:grid;justify-items:center;gap:14px;padding:20px;max-width:92vw;max-height:100dvh;
    overflow:auto;align-content:center;
  }
  #qr{
    width:min(62vw,52dvh,262px);height:min(62vw,52dvh,262px);
    position:static;image-rendering:pixelated;flex:0 0 auto;
  }
  #keyUrl{
    font:italic 13px/1.5 Georgia,"Times New Roman",serif;letter-spacing:.01em;
    color:var(--ink-soft);text-align:center;max-width:30ch;
    overflow-wrap:anywhere;cursor:pointer;
  }
  #keyNote{font:italic 14px/1.4 Georgia,serif;color:var(--ink-soft);text-align:center;max-width:26ch}

  #attrib{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(3px + env(safe-area-inset-bottom));
    font:9px/1 -apple-system,system-ui,sans-serif;letter-spacing:.06em;
    color:rgba(29,32,29,.26);pointer-events:none;z-index:6;white-space:nowrap;display:none;
  }
  @media (prefers-reduced-motion:reduce){.pip{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
</div>

<div id="hud">
  <div id="say"><input id="sayIn" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="…"><div id="mic"><svg width="11" height="14" viewBox="0 0 11 14"><path id="micVoice" d="M5.5 1.2a2 2 0 0 1 2 2v3.4a2 2 0 1 1-4 0V3.2a2 2 0 0 1 2-2Zm-4 5.6a4 4 0 0 0 8 0M5.5 10.8v2" fill="none" stroke="#1d201d" stroke-width="1.3" stroke-linecap="round"/><path id="micDrop" d="M2 3l7 8M9 3l-7 8" fill="none" stroke="#1d201d" stroke-width="1.4" stroke-linecap="round" style="display:none"/></svg></div></div>

  <div class="pip" id="back" role="button" aria-label="Unweave">
    <svg width="24" height="24" viewBox="0 0 24 24">
      <path id="backGlyph" d="M17.5 12a5.5 5.5 0 1 1-2.6-4.67" fill="none" stroke="#1d201d" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M15.2 4.4 15.3 7.9 11.9 7.6" fill="none" stroke="#1d201d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="pip" id="undo" role="button" aria-label="Unpick last thread">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <path d="M3.4 16.6c3.4 0 3.4-7.2 6.8-7.2 1.6 0 2.3 1.6 3 3.2" fill="none" stroke="#1d201d" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M15.8 15.6c.7 1.5 1.4 3 3 3 3.4 0 3.4-7.2 3.8-7.2" fill="none" stroke="#1d201d" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="2.6 3"/>
      <path d="M11.6 9.6l3.2 7.4M14.8 9.6l-3.2 7.4" fill="none" stroke="#bf4526" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="pip" id="thread" role="button" aria-label="Leave a thread">
    <svg width="72" height="72" viewBox="0 0 72 72">
      <circle class="ring" cx="36" cy="36" r="27.5"/>
      <path class="glyph" id="threadGlyph" d="M21 44c5.5 0 5.5-16 11-16s5.5 16 11 16 5.5-16 8-16"/>
      <circle class="knob" id="threadKnob" cx="21" cy="44" r="2.6"/>
    </svg>
  </div>

  <div class="pip" id="people" role="button" aria-label="Who is on this ground">
    <svg width="30" height="30" viewBox="0 0 30 30" id="peopleGlyph"></svg>
  </div>
</div>

<div id="key"><div id="keyInner">
  <canvas id="qr"></canvas>
  <div id="keyUrl"></div>
  <div id="keyNote"></div>
</div></div>

      for (var j = 0; j + 3 < pts.length; j += 2) {

        var c0x = Math.floor(Math.min(ax, bx) / BIND_CELL), c1x = Math.floor(Math.max(ax, bx) / BIND_CELL);
        var c0y = Math.floor(Math.min(ay, by) / BIND_CELL), c1y = Math.floor(Math.max(ay, by) / BIND_CELL);
        if ((c1x - c0x) * (c1y - c0y) > 40) continue;
        for (var cx = c0x; cx <= c1x; cx++) for (var cy = c0y; cy <= c1y; cy++) {
          var k = cx + ":" + cy;
          var arr = GROUND_INDEX.get(k);
          if (!arr) { arr = []; GROUND_INDEX.set(k, arr); }
          arr.push(ax, ay, bx, by);
        }
      }
    }
  }
}

function nearestOnGround(x, y, tol) {
  if (!GROUND_INDEX) buildGroundIndex();
  var cx = Math.floor(x / BIND_CELL), cy = Math.floor(y / BIND_CELL);
  var best = null, bd = tol * tol;
  for (var ox = -1; ox <= 1; ox++) for (var oy = -1; oy <= 1; oy++) {
    var arr = GROUND_INDEX.get((cx + ox) + ":" + (cy + oy));
    if (!arr) continue;
    for (var i = 0; i < arr.length; i += 4) {
      var ax = arr[i], ay = arr[i + 1], bx = arr[i + 2], by = arr[i + 3];
      var dx = bx - ax, dy = by - ay;
      var L2 = dx * dx + dy * dy;
      var t = L2 > 0 ? ((x - ax) * dx + (y - ay) * dy) / L2 : 0;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      var px = ax + t * dx, py = ay + t * dy;
      var d2 = (x - px) * (x - px) + (y - py) * (y - py);
      if (d2 < bd) { bd = d2; best = [px, py]; }
    }
  }
  return best;
}

/* about thirty metres here — a stride, not a correction */
var BIND_TOL = 30 / 40075016 * 1.2;
function settleIntoGround(pts) {
  var out = new Float64Array(pts.length);
  var moved = 0;
  for (var i = 0; i < pts.length; i += 2) {
    var hit = nearestOnGround(pts[i], pts[i + 1], BIND_TOL);
    if (hit) { out[i] = hit[0]; out[i + 1] = hit[1]; moved++; }
    else { out[i] = pts[i]; out[i + 1] = pts[i + 1]; }
  }
  if (moved < 2) return pts;
  /* ease between what was drawn and where it settled, so the thread still
     remembers the hand that made it */
  for (var j = 0; j < pts.length; j++) out[j] = pts[j] * 0.22 + out[j] * 0.78;
  return out;
}

function materialise(op, opts) {
  if (op.k === "t") {
    var raw = op.d.p, pts = new Float64Array(raw.length);

    var fb = fibreOf(op.a);
    var bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
    for (var b = 0; b < pts.length; b += 2) {

      bx0: bx0, by0: by0, bx1: bx1, by1: by1,

/* ---------- weaving ----------
   A knot is not an arithmetic accident of two polylines crossing. It is a PLACE
   that more than one thread has passed through. Every thread is counted once per
   place, so a jittery trace and a clean one weigh the same, and coming back on a
   later day counts as a return whether or not anything ever crossed there.
   Places are held at ~32 m and gathered upward to whatever scale you are looking at. */

var BASE_Z = 20;                                  /* the finest place we hold */
var BASE_CELL = 1 / Math.pow(2, BASE_Z);          /* ~32 m on the ground here */
var KEY_SPAN = 1 << BASE_Z;

function packCell(cx, cy) { return cx * KEY_SPAN + cy; }

/* The places a thread passes through, walked at half a cell so nothing is skipped,
   and the bearing on which it crossed each one. Bearing is what tells a meeting
   from a shared corridor, and unlike anything positional it does not move when
   the trace wobbles. Folded to 180 degrees, in four bins: a direction, not a heading. */
function threadCells(pts) {
  if (pts.length < 4) return [];
  var step = BASE_CELL * 0.5;
  var wx = [], wy = [];
  wx.push(pts[0]); wy.push(pts[1]);
  for (var i = 0; i + 3 < pts.length; i += 2) {
    var x1 = pts[i], y1 = pts[i + 1], x2 = pts[i + 2], y2 = pts[i + 3];
    var d = Math.hypot(x2 - x1, y2 - y1);
    var n = Math.min(400, Math.max(1, Math.ceil(d / step)));
    for (var j = 1; j <= n; j++) { wx.push(x1 + (x2 - x1) * j / n); wy.push(y1 + (y2 - y1) * j / n); }
  }
  var seen = new Map(), out = [];
  var WIN = 5;                                  /* the bearing is read over ~160 m, not one cell */
  for (var q = 0; q < wx.length; q++) {
    var cx = Math.floor(wx[q] / BASE_CELL), cy = Math.floor(wy[q] / BASE_CELL);
    var k = packCell(cx, cy);
    if (seen.has(k)) continue;
    var a = Math.max(0, q - WIN), b = Math.min(wx.length - 1, q + WIN);
    var dx = wx[b] - wx[a], dy = wy[b] - wy[a];
    if (Math.abs(dx) < 1e-12 && Math.abs(dy) < 1e-12) { dx = wx[wx.length - 1] - wx[0]; dy = wy[wy.length - 1] - wy[0]; }
    var ang = Math.atan2(dy, dx);
    if (ang < 0) ang += Math.PI;
    if (ang >= Math.PI) ang -= Math.PI;
    var bin = Math.min(3, Math.floor(ang / (Math.PI / 4)));
    seen.set(k, 1);
    out.push(k, bin);
  }
  return out;
}

/* Store.knots holds the finest places; the drawn weave is gathered from them. */
function weaveThread(th) {
  th.cells = threadCells(th.pts);
  var bucket = Math.floor(th.t / 36e5);            /* an hour apart is a return */
  for (var i = 0; i < th.cells.length; i += 2) {
    var k = th.cells[i], bin = th.cells[i + 1];
    var kn = Store.knots.get(k);
    if (!kn) {
      var cx = Math.floor(k / KEY_SPAN), cy = k - cx * KEY_SPAN;
      kn = {
        key: k, cx: cx, cy: cy,
        x: (cx + 0.5) * BASE_CELL, y: (cy + 0.5) * BASE_CELL,
        eid: [], ea: [], eb: [], et: [], bins: new Set(),
        t0: Infinity, t1: 0, grew: 0
      };
      Store.knots.set(k, kn);
    }
    if (kn.eid.indexOf(th.id) < 0) {
      kn.eid.push(th.id); kn.ea.push(th.a); kn.eb.push(bucket); kn.et.push(th.t);
      kn.bins.add(bin);
    }
    if (th.t < kn.t0) kn.t0 = th.t;
    if (th.t > kn.t1) kn.t1 = th.t;
    kn.grew = Math.max(kn.grew, th.t);
  }
  touchWeave();
}

/* co  = how many threads have come through this place
   au  = how many people
   ret = how many times someone came back on a later occasion */
/* A place worn deep by one person is not the same thing as a place shared wide.
   Depth adds; people multiply; and common ground is not something you can make alone. */
function weighPlace(co, au, ret) { return (co + ret) * (1 + Math.log2(Math.max(1, au))); }

  var au = new Set(), vi = new Set();
  for (var i = 0; i < kn.ea.length; i++) { au.add(kn.ea[i]); vi.add(kn.ea[i] + "|" + kn.eb[i]); }
  return weighPlace(kn.eid.length, au.size, vi.size - au.size);
}

var V = { x: mercX(-84.3880), y: mercY(33.7490), z: 12.4 };

function toScreenY(my) { return (my - V.y) * worldSize() + H / 2; }

var SAFE_B = 0, SAFE_T = 0;

var Tiles = {
  cache: new Map(), fails: 0, off: false, pending: 0, anyOk: false,
  hosts: ["a", "b", "c"],
  key: function (z, x, y) { return z + "/" + x + "/" + y; },
  get: function (z, x, y) {
    var k = this.key(z, x, y);
    var e = this.cache.get(k);
    if (e) return e;
    if (this.off || this.pending > 6) return null;
    var img = new Image();
    e = { img: img, ok: false, bad: false, born: performance.now() };
    this.cache.set(k, e);
    this.pending++;
    var self = this;
    img.crossOrigin = "anonymous";
    img.onload = function () {
      self.pending--; e.ok = true; self.fails = 0;
      if (!self.anyOk) { self.anyOk = true; var at = document.getElementById("attrib"); if (at) at.style.display = "block"; }
      weaveDirty = true; dirty = true;
    };
    img.onerror = function () {
      self.pending--; e.bad = true; self.fails++;
      if (self.fails >= 4 && !self.anyOk) self.off = true;
      if (self.fails >= 12) self.off = true;
      dirty = true;
    };
    img.src = "https://" + this.hosts[(x + y) % 3] + ".tile.openstreetmap.org/" + z + "/" + x + "/" + y + ".png";
    if (this.cache.size > 320) {
      var it = this.cache.keys();
      for (var i = 0; i < 80; i++) { var kk = it.next().value; if (kk !== k) this.cache.delete(kk); }
    }
    return e;
  }
};

function drawTiles() {
  if (Tiles.off) return;
  if (navigator.onLine === false) return;
  var tz = clamp(Math.round(V.z), 3, 19);
  var scale = worldSize() / (256 * Math.pow(2, tz));
  var tsize = 256 * scale;
  var n = Math.pow(2, tz);
  var left = fromScreenX(0) * n, right = fromScreenX(W) * n;
  var top = fromScreenY(0) * n, bot = fromScreenY(H) * n;
  var x0 = Math.floor(left), x1 = Math.floor(right), y0 = Math.floor(top), y1 = Math.floor(bot);
  if ((x1 - x0 + 1) * (y1 - y0 + 1) > 90) return;
  ctx.save();
  try { ctx.filter = "grayscale(1) contrast(.62) brightness(1.16)"; } catch (e) { }
  ctx.globalAlpha = 0.42;
  for (var ty = y0; ty <= y1; ty++) {
    if (ty < 0 || ty >= n) continue;
    for (var tx = x0; tx <= x1; tx++) {
      var wx = ((tx % n) + n) % n;
      var e = Tiles.get(tz, wx, ty);
      if (!e || !e.ok) continue;
      var sx = toScreenX(tx / n), sy = toScreenY(ty / n);
      ctx.drawImage(e.img, sx, sy, tsize + 1, tsize + 1);
    }
  }
  ctx.restore();
}

/* ============================================================
   PAPER
   ============================================================ */
var paperTex = null, paperCanvas = null;
function paperTile() { if (!paperCanvas) paperCanvas = makePaper(); return paperCanvas; }
function makePaper() {
  /* correlated grain, so ink has something to sit in */
  var s = 192, L = 48, c = document.createElement("canvas");
  c.width = s; c.height = s;
  var g = c.getContext("2d");
  var lat = new Float32Array((L + 1) * (L + 1));
  for (var i = 0; i <= L; i++) for (var j = 0; j <= L; j++) {
    lat[i * (L + 1) + j] = hash01(i * 131 + j * 977 + 7);
  }
  var im = g.createImageData(s, s), k = s / L;
  for (var y = 0; y < s; y++) {
    for (var x = 0; x < s; x++) {
      var fx = x / k, fy = y / k;
      var x0 = fx | 0, y0 = fy | 0, tx = fx - x0, ty = fy - y0;
      var a = lat[y0 * (L + 1) + x0], b = lat[y0 * (L + 1) + x0 + 1];
      var cL = lat[(y0 + 1) * (L + 1) + x0], d = lat[(y0 + 1) * (L + 1) + x0 + 1];
      tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
      var nv = (a + (b - a) * tx) * (1 - ty) + (cL + (d - cL) * tx) * ty;
      var fine = hash01(x * 7919 + y * 104729);
      var v = 232 + nv * 16 + fine * 7;
      var o = (y * s + x) * 4;
      im.data[o] = v; im.data[o + 1] = v - 4; im.data[o + 2] = v - 14;
      im.data[o + 3] = 40 + (fine * 26) | 0;
    }
  }
  g.putImageData(im, 0, 0);
  return c;
}

/* ============================================================
   INK GROUND
   ============================================================ */
/* ----------------------------------------------------------------
   THE GROUND IS FIBRE TOO.
   The city is not a printed basemap with drawing on top of it. Water, rail
   and roads are threads already laid in the cloth — spun, tapered, breathing —
   and a thread somebody leaves today passes over some of them and under others.
   ---------------------------------------------------------------- */
var INK_STYLE = {
  water: { col: "#7fa9b0", w: [1.4, 6.0], a: 0.62, make: "solid", bind: 1 },
  rail: { col: "#6e736d", w: [0.6, 1.5], a: 0.28, make: "dash", bind: 1 },
  secondary: { col: "#5d635c", w: [0.5, 1.5], a: 0.24, make: "solid", bind: 0 },
  primary: { col: "#484e47", w: [0.8, 2.8], a: 0.40, make: "solid", bind: 1 },
  motorway: { col: "#3a403a", w: [1.3, 4.6], a: 0.52, make: "solid", bind: 1 },
  boundary: { col: "#9a9083", w: [0.7, 1.4], a: 0.30, make: "dash", bind: 0 }
};
var INK_ORDER = ["boundary", "rail", "secondary", "water", "primary", "motorway"];

var groundLaid = [];

/* how full the ground is, decided once, before anything reads it */
function measureCrowd() {
  var m = LAYER_PAD;
  var vx0 = fromScreenX(-m), vx1 = fromScreenX(W + m);
  var vy0 = fromScreenY(-m), vy1 = fromScreenY(H + m);
  var count = 0, all = 0;
  for (var i = 0; i < Store.threads.length; i++) {
    var t = Store.threads[i];
    if (t.bx1 < vx0 || t.bx0 > vx1 || t.by1 < vy0 || t.by0 > vy1) continue;
    all++;
    if (t.t <= timeCursor) count++;
  }
  placeCrowd = count;
  /* Pressure follows how full this ground IS, not how much of it the time
     cursor happens to be showing — winding time back must thin the cloth, not
     change the language it is drawn in. */
  press = clamp(1 - Math.log2(1 + all / 36) * 0.17, 0.34, 1);
  plainWeave = all > 1400;
  laid = plainWeave ? null : groundLaid.slice(0, 190);
}

function drawInk() {
  var ws = worldSize();
  var zt = clamp((V.z - 9) / 8, 0, 1);
  var thin = (Tiles.off || !Tiles.anyOk) ? 1 : 0.72;
  var lift = 1 - warp * 0.18;
  var mg = LAYER_PAD;
  var vx0 = fromScreenX(-mg), vx1 = fromScreenX(W + mg);
  var vy0 = fromScreenY(-mg), vy1 = fromScreenY(H + mg);
  groundLaid.length = 0;
  var bindCap = 190;

  for (var li = 0; li < INK_ORDER.length; li++) {
    var name = INK_ORDER[li], lines = INK[name];
    if (!lines || !lines.length) continue;
    var st = INK_STYLE[name];
    if (name === "rail" && V.z < 10.5) continue;
    if (name === "secondary" && V.z < 10.2) continue;
    var lw = lerp(st.w[0], st.w[1], zt) * thin;
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.fillStyle = st.col;
    ctx.globalAlpha = st.a * lift;

    for (var i = 0; i < lines.length; i++) {
      var p = lines[i];
      var n = 0, lastX = -1e9, lastY = -1e9, on = false;
      _tx.length = 0; _ty.length = 0;
      for (var j = 0; j < p.length; j += 2) {
        if (p[j] > vx0 && p[j] < vx1 && p[j + 1] > vy0 && p[j + 1] < vy1) on = true;
        var sx = (p[j] - V.x) * ws + W / 2, sy = (p[j + 1] - V.y) * ws + H / 2;
        if (n > 0 && Math.abs(sx - lastX) < 0.5 && Math.abs(sy - lastY) < 0.5) continue;
        _tx.push(sx); _ty.push(sy); lastX = sx; lastY = sy; n++;
      }
      if (!on || n < 2) continue;
      _seed = (i * 2654435761) % 100000;
      ribbon(n, lw);
      ctx.fill();
      if (st.make === "dash" && lw > 0.9) {
        ctx.save();
        ctx.globalAlpha = st.a * lift * 0.9;
        ctx.strokeStyle = PAPER_LIT; ctx.lineWidth = lw * 0.62;
        ctx.setLineDash([lw * 0.8, lw * 2.4]);
        ctx.beginPath();
        for (var q = 0; q < n; q++) { if (q === 0) ctx.moveTo(_tx[q], _ty[q]); else ctx.lineTo(_tx[q], _ty[q]); }
        ctx.stroke();

      /* the strong ground fibres are part of the weave and can surface through it */
      if (st.bind && groundLaid.length < bindCap && lw > 1.0) {
        var kx = new Float32Array(n), ky = new Float32Array(n);
        for (var c = 0; c < n; c++) { kx[c] = _tx[c]; ky[c] = _ty[c]; }
        groundLaid.push({ th: { c: st.col, id: "g" + li + "_" + i }, x: kx, y: ky, n: n, w: lw, a: st.a * lift });
      }
    }
    ctx.restore();
  }
  drawPlaces();
}

function drawPlaces() {
  if (V.z < 10.4 || !PLACES.length) return;
  /* Names are for a ground nobody has woven yet. As the weave arrives it becomes
     the thing worth reading, and the machine's labels get out of its way. */
  var nameFade = 1 - clamp((placeCrowd - 3) / 22, 0, 1);
  if (nameFade <= 0.02) return;
  var ws = worldSize();

   THE WEAVE — threads, knots, common ground
   ============================================================ */
var timeCursor = Infinity;   /* unweave cursor */

var openKnot = null;

function threadWidth() { return clamp(1.0 + (V.z - 10) * 0.42, 1.1, 4.6); }

  var pts = th.pts, n = 0;

  _tx.length = 0; _ty.length = 0;

    var jy = (hash01(seedBase + i * 2 + 1) - 0.5) * 0.5 + (hash01(seedBase + 57 + Math.floor(i / 5)) - 0.5) * 0.8;
    var sx = (pts[i * 2] - V.x) * ws + W / 2 + jx;

var _seed = 0;

function halfWidth(t, i, width) {

  for (i = 0; i < n; i++) {

function drawWeave(now) {

/* The ladder reads off the place's own history — never off the zoom — but it is

function buildKnotClusters() {

    var a = all[i];

    if (sx < -60 || sx > W + 60 || sy < -60 || sy > H + 60) continue;
    vis.push(a);
  }
  /* only ever as many knots as the screen can hold without becoming beads */
  /* The strongest place in a neighbourhood speaks for it, so the weave shows
     peaks rather than a lattice of equal beads. But weight is the history of a

     ground a year old it would be outranked by everything and never drawn. So
     some of the room is kept for what has just changed, whatever it weighs. */

    .sort(function (p, q) { return q.grew - p.grew; })
    .slice(0, Math.max(4, Math.round(cap * 0.4)));

    var ar = knotRadius(a2.w), ok = true;
    for (var u = 0; u < kept.length; u++) {

      var kr = knotRadius(kept[u].w);

      if (d2 < Math.max(mine2 ? 18 : 34, (ar + kr) * (mine2 ? 0.6 : 1.05))) { ok = false; break; }

     row of separate places. Where several of the same strength sit in a line,
     the strongest speaks for them. */

  for (var ki = 0; ki < kept.length; ki++) {
    var kk = kept[ki];

    var reach3 = Math.max(58, knotRadius(kk.w) * 3.4), peers2 = 0, beaten = false;
    for (var kj = 0; kj < kept.length; kj++) {

var _thById = null, _thByIdN = -1;

    for (var i = 0; i < Store.threads.length; i++) _thById.set(Store.threads[i].id, Store.threads[i]);
    _thByIdN = Store.threads.length;

function knotRadius(w) {
  return clamp(2.4 + Math.pow(w, 0.46) * (2.0 + clamp(V.z - 11, 0, 6) * 0.34), 2.4, 54);
}

function drawKnot(kn, now) {
  var ws = worldSize();
  var sx = (kn.x - V.x) * ws + W / 2, sy = (kn.y - V.y) * ws + H / 2;
  if (sx < -80 || sx > W + 80 || sy < -80 || sy > H + 80) return;
  var w = kn.w, st = knotStage(w, kn.au);
  var r = knotRadius(w);
  var isOpen = openKnot === kn;
  var HM = ((openKnot && !isOpen) ? 0.2 : 1) * clamp(1 / (0.45 + 0.55 * press), 1, 1.7) * reveal
    * (1 + (kn.fresh || 0) * 0.55);

  var accent = many ? "#bf4526" : "#2f7d84";

  ctx.save();
  ctx.translate(sx, sy);

  /* 4 · COMMON GROUND.
     Not a hatch stamped on the map. The field is made of the threads themselves:
     as many strands as have come through, laid on the bearings actually recorded
     here, interlaced over and under, fading to nothing at the edges so the place
     radiates instead of ending at a border. */
  if (st >= 4) {
    var over = clamp(Math.log2(w / 68), 0, 3.2);
    var R = r * (1.45 + over * 0.42);
    var bins = kn.binList || (kn.binList = Array.from(kn.bins || [0, 2]));
    var hands = kn.handList;
    if (!hands) {
      hands = []; var seenH = {};
      for (var hh = 0; hh < kn.threadList.length && hands.length < 8; hh++) {
        var th2 = threadById(kn.threadList[hh]);
        if (!th2 || seenH[th2.a]) continue;
        seenH[th2.a] = 1; hands.push(th2.c);
      }
      if (!hands.length) hands = ["#2f7d84"];
      kn.handList = hands;
    }
    var strands = clamp(Math.round(kn.co * 0.85), 7, 30);
    var seedK = Math.abs(Math.round(kn.x * 1e6)) % 99991;
    ctx.lineCap = "round";
    for (var si = 0; si < strands; si++) {
      var bin = bins[si % bins.length];
      var ang2 = (bin + 0.5) * (Math.PI / 4) + (hash01(seedK + si * 7) - 0.5) * 0.55;
      var spread = ((si % 2 ? 1 : -1) * Math.floor(si / 2 + 1) / (strands / 2 + 1)) * R * 0.92;
      spread += (hash01(seedK + si * 13 + 3) - 0.5) * R * 0.12;
      var ux = Math.cos(ang2), uy = Math.sin(ang2);
      var px = -uy * spread, py = ux * spread;
      var reachS = Math.sqrt(Math.max(1, R * R - spread * spread));
      var col = hands[si % hands.length];
      var sw = threadWidth() * (0.7 + 0.5 * hash01(seedK + si * 31));
      var caseIt = (si % 2 === 0);
      var STEPS = 9;
      for (var g2 = 0; g2 < STEPS; g2++) {
        var t0 = -1 + (2 * g2) / STEPS, t1 = -1 + (2 * (g2 + 1)) / STEPS;
        var mid = (t0 + t1) / 2;
        var fall = Math.pow(Math.max(0, 1 - Math.abs(mid)), 0.75) * Math.pow(Math.max(0, 1 - Math.abs(spread) / R), 0.55);
        if (fall <= 0.02) continue;

        var bx3 = px + ux * reachS * t1, by3 = py + uy * reachS * t1;

        }

    var hands = [], seen = {};

      if (mx2 < -8 || mx2 > W + 8 || my2 < -8 || my2 > H + 8) continue;
      ctx.globalAlpha = 0.55; ctx.strokeStyle = nn.c; ctx.lineWidth = 1.1;

    var sx = (n.x - V.x) * ws + W / 2, sy = (n.y - V.y) * ws + H / 2;

    }

/* ---------- live strokes (mine in progress, and other people's) ---------- */
var drawingPts = null;      /* Float64Array-ish array of merc pairs */

function drawLive(now) {
  var ws = worldSize();

      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);

/* what has just happened, drawn over the cloth every frame */
function drawFreshMarks(now) {
  if (!renderedKnots.length) return;
  /* while a pinch is in flight the cached cloth is being scaled and the live
     marks are not; rather than contradict it, they wait for the gesture to end */
  if (lTag && Math.abs(lTag.z - V.z) > 0.01) return;
  var ws = worldSize(), t = Date.now();
  ctx.save();

    ctx.globalAlpha = 0.42; ctx.strokeStyle = "#bf4526"; ctx.lineWidth = 1;
    ctx.setLineDash([2, 3]);

    ctx.stroke();

    if (f <= 0.02) continue;

    ctx.globalAlpha = f * 0.22; ctx.lineWidth = 0.9;

/* ---------- presence ---------- */
var peers = new Map(); /* author -> {c, x, y, ts} */
function drawPresence(now) {
  var ws = worldSize();
  peers.forEach(function (p, a) {
    if (now - p.ts > 14000) { peers.delete(a); refreshPeopleGlyph(); return; }
    if (p.x == null) return;
    var sx = (p.x - V.x) * ws + W / 2, sy = (p.y - V.y) * ws + H / 2;
    if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) return;

/* ---------- the loom warp (only while a thread can be left) ---------- */
var warp = 0;
function drawWarp() {
  if (warp <= 0.01) return;

  var gap = 7;
  ctx.strokeStyle = "#1d201d"; ctx.lineWidth = 0.5;

  for (var x = 0; x < W; x += gap) {

/* ---------- what the ground wants ----------
   No words, no arrow, no coach mark. The ground simply does the thing once,
   in the same fibre you will be given: a thread is laid, another crosses it,
   the crossing tightens into a knot. Then it lets go. It is never written down. */
var demoOff = readLS("cg.taught", "") === "1", demoPulse = 0, demoGeom = null;

/* two paths that genuinely meet; the meeting point is found, never assumed */
function buildDemoGeom() {
  var bx = W / 2, by = H - 54 - safeBottom();
  var cx = W / 2, cy = H * 0.44;

      out.push([
        u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
        u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]
      ]);
    }
    return out;
  }

  /* it starts clear of the control: the gesture is press here, then draw there */
  var A = bez([bx - R * 0.62, by - H * 0.055], [bx - R * 1.15, by - H * 0.12],
    [cx - R * 0.85, cy - H * 0.02], [cx + R * 0.72, cy - H * 0.16], 60);
  /* someone else comes across it */
  var B = bez([cx - R * 1.12, cy - H * 0.16], [cx - R * 0.3, cy - H * 0.02], [cx + R * 0.2, cy + H * 0.02], [cx + R * 1.05, cy + H * 0.10], 60);

  /* where do they actually cross? */
  var best = null;

    for (var j = 0; j + 1 < B.length; j++) {
      var a1 = A[i], a2 = A[i + 1], b1 = B[j], b2 = B[j + 1];
      var d = (a2[0] - a1[0]) * (b2[1] - b1[1]) - (a2[1] - a1[1]) * (b2[0] - b1[0]);
      if (Math.abs(d) < 1e-9) continue;
      var t = ((b1[0] - a1[0]) * (b2[1] - b1[1]) - (b1[1] - a1[1]) * (b2[0] - b1[0])) / d;
      var u = ((b1[0] - a1[0]) * (a2[1] - a1[1]) - (b1[1] - a1[1]) * (a2[0] - a1[0])) / d;
      if (t < 0 || t > 1 || u < 0 || u > 1) continue;
      best = {
        x: a1[0] + t * (a2[0] - a1[0]), y: a1[1] + t * (a2[1] - a1[1]),
        ta: (i + t) / (A.length - 1), tb: (j + u) / (B.length - 1)
      };
      break;
    }
  }
  if (!best) best = { x: cx, y: cy, ta: 0.6, tb: 0.5 };
  return { A: A, B: B, ix: best.x, iy: best.y, ta: best.ta, tb: best.tb, w: W, h: H };
}

function drawDemo(now) {
  /* the ground stops explaining itself the moment anything real is happening on it */
  /* until the meeting point has answered, this place might be full */
  if (!GOT_CLOTH && net.state === "open" && Date.now() - SESSION_T0 < 7000 && !Store.threads.length) {
    if (demoPulse) { demoPulse = 0; threadBtn.classList.remove("beat"); }
    return;
  }
  if (demoOff || sayAt || Store.threads.length || Store.notes.length || drawingPts || livePeers.size || peers.size) {
    if (demoPulse) { demoPulse = 0; threadBtn.classList.remove("beat"); }
    return;
  }
  if (!demoGeom || demoGeom.w !== W || demoGeom.h !== H) demoGeom = buildDemoGeom();
  var G = demoGeom;

  var T = 7600, u = (now % T) / T;
  var pA = clamp((u - 0.04) / 0.28, 0, 1);
  var sB = clamp((u - 0.34) / 0.30, 0, 1);
  var out = u < 0.82 ? 1 : clamp((1 - u) / 0.18, 0, 1);

  /* the second thread slows as it passes over the first */
  var s1 = G.tb * 0.72, s2 = s1 + 0.17, pB;
  if (sB <= s1) pB = G.tb * (sB / (s1 || 1));
  else if (sB <= s2) pB = G.tb;
  else pB = G.tb + (1 - G.tb) * ((sB - s2) / (1 - s2));
  var atCross = sB > s1 && sB <= s2;
  var pK = clamp((sB - s2) / 0.26, 0, 1);

  var warm = MY_FIBRE.warm;
  var other = warm ? "#2f7d84" : "#bf4526";

  ctx.save();
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  /* laid in exactly the fibre the person will be given, so the demonstration
     teaches the language the ground actually speaks */
  function lay(path, prog, col, wid, seed) {
    if (prog <= 0.005) return null;
    var n = Math.max(2, Math.round(prog * (path.length - 1)) + 1);
    _tx.length = 0; _ty.length = 0;
    for (var i = 0; i < n; i++) { _tx.push(path[i][0]); _ty.push(path[i][1]); }
    _seed = seed;
    ctx.beginPath();
    for (var j = 0; j < n; j++) { if (j === 0) ctx.moveTo(_tx[j], _ty[j]); else ctx.lineTo(_tx[j], _ty[j]); }
    ctx.globalAlpha = out * 0.78; ctx.strokeStyle = PAPER_LIT; ctx.lineWidth = wid + 1.7;
    ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.stroke();
    ctx.globalAlpha = out * 0.10; ctx.strokeStyle = col; ctx.lineWidth = wid * 2.2; ctx.stroke();
    ctx.globalAlpha = out * 0.9; ctx.fillStyle = col;
    ribbon(n, wid); ctx.fill();
    return prog < 1 ? path[n - 1] : null;
  }
  var headA = lay(G.A, pA, MY_COLOR, 3.2, 311);
  var headB = lay(G.B, pB, other, 2.9, 977);
  /* and the first thread surfaces back over the second, the way cloth does */
  if (pB > G.tb && pA >= G.ta) {
    var iA = Math.max(1, Math.round(G.ta * (G.A.length - 1)));
    _tx.length = 0; _ty.length = 0;
    for (var q2 = Math.max(0, iA - 3); q2 <= Math.min(G.A.length - 1, iA + 3); q2++) { _tx.push(G.A[q2][0]); _ty.push(G.A[q2][1]); }
    ctx.save();
    ctx.beginPath(); ctx.arc(G.ix, G.iy, 9, 0, TAU); ctx.clip();
    ctx.beginPath();
    for (var q3 = 0; q3 < _tx.length; q3++) { if (q3 === 0) ctx.moveTo(_tx[q3], _ty[q3]); else ctx.lineTo(_tx[q3], _ty[q3]); }
    ctx.globalAlpha = out * 0.78; ctx.strokeStyle = PAPER_LIT; ctx.lineWidth = 3.2 + 1.7; ctx.stroke();
    ctx.globalAlpha = out * 0.9; ctx.strokeStyle = MY_COLOR; ctx.lineWidth = 3.0; ctx.stroke();
    ctx.restore();
  }
  var head = headB || headA;
  if (head) {
    ctx.globalAlpha = out * (atCross ? 1 : 0.9);
    ctx.fillStyle = headB ? other : MY_COLOR;
    ctx.beginPath(); ctx.arc(head[0], head[1], atCross ? 4.6 : 3.6, 0, TAU); ctx.fill();
    if (atCross) {
      ctx.globalAlpha = out * 0.42; ctx.strokeStyle = other; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(head[0], head[1], 9 + Math.sin(now / 130) * 2, 0, TAU); ctx.stroke();
    }
  }
  /* and where they met, exactly there, a knot */
  if (pK > 0) {
    var r = 4 + pK * 10;
    ctx.globalAlpha = out * pK * 0.9;
    ctx.strokeStyle = "rgba(29,32,29,.8)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(G.ix, G.iy, r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = "#bf4526"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(G.ix, G.iy, r * 0.52, 0, TAU); ctx.stroke();
    ctx.globalAlpha = out * pK * (1 - pK) * 2.4;
    ctx.beginPath(); ctx.arc(G.ix, G.iy, r + pK * 24, 0, TAU); ctx.stroke();
  }
  ctx.restore();

  /* the control keeps time from the first stroke until the knot is tied */
  var want = (pA > 0 && pK < 1) ? 1 : 0;
  if (want !== demoPulse) { demoPulse = want; threadBtn.classList.toggle("beat", !!want); }
  dirty = true;
}

/* while the fabric is running backwards, say plainly which day you are looking at */
var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function drawEra() {
  if (timeCursor === Infinity || !isFinite(Store.bounds.t1) || !Store.bounds.t1) return;
  var d = new Date(clamp(timeCursor, Store.bounds.t0, Store.bounds.t1));
  var label = (d.getDate() + " " + MON[d.getMonth()]).toUpperCase();
  ctx.save();
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.font = '600 10px -apple-system,system-ui,"Helvetica Neue",sans-serif';
  var lw3 = ctx.measureText(label).width + (label.length - 1) * 2.2;
  var tx3 = (W - lw3) / 2, ty3 = 18 + safeTop();
  for (var ci2 = 0; ci2 < label.length; ci2++) {
    var ch2 = label.charAt(ci2);
    ctx.globalAlpha = 0.85; ctx.strokeStyle = "rgba(241,236,224,.9)"; ctx.lineWidth = 3.4; ctx.lineJoin = "round";
    ctx.strokeText(ch2, tx3, ty3);
    ctx.globalAlpha = 0.5; ctx.fillStyle = "#1d201d"; ctx.fillText(ch2, tx3, ty3);
    tx3 += ctx.measureText(ch2).width + 2.2;
  }
  ctx.restore();
}

/* ============================================================
   FRAME — the ground and the weave are drawn into a padded layer and
   carried while you travel; only what is alive is drawn every frame.
   ============================================================ */
var dirty = true;
var LAYER_PAD = 120;
var layer = document.createElement("canvas");
var lctx = layer.getContext("2d");
var lTag = null;
var weaveDirty = true;

function renderLayer(now) {
  weaveDirty = false;            /* anything the draw itself marks must survive */
  var pad = LAYER_PAD;
  var cw = Math.round((W + pad * 2) * DPR), ch = Math.round((H + pad * 2) * DPR);
  if (layer.width !== cw || layer.height !== ch) { layer.width = cw; layer.height = ch; }
  var prev = ctx;
  ctx = lctx;
  ctx.setTransform(DPR, 0, 0, DPR, pad * DPR, pad * DPR);
  ctx.clearRect(-pad, -pad, W + pad * 2, H + pad * 2);
  ctx.fillStyle = PAPER;
  ctx.fillRect(-pad, -pad, W + pad * 2, H + pad * 2);
  drawTiles();
  if (!paperTex) paperTex = cv.getContext("2d").createPattern(paperTile(), "repeat");
  if (paperTex) { ctx.save(); ctx.fillStyle = paperTex; ctx.fillRect(-pad, -pad, W + pad * 2, H + pad * 2); ctx.restore(); }
  measureCrowd();
  drawInk();
  drawWeave(now);
  ctx = prev;
  lTag = { x: V.x, y: V.y, z: V.z, pad: pad, w: W, h: H, v: weaveVersion };
}

function frame(now) {
  requestAnimationFrame(frame);
  stepMotion(now);
  if (!dirty) return;
  dirty = false;

  var ws = worldSize();
  var needs = weaveDirty || !lTag || lTag.v !== weaveVersion || lTag.w !== W || lTag.h !== H;
  if (!needs && lTag.z === V.z) {
    var dx = (lTag.x - V.x) * ws, dy = (lTag.y - V.y) * ws;
    if (Math.abs(dx) > LAYER_PAD - 4 || Math.abs(dy) > LAYER_PAD - 4) needs = true;
  } else if (!needs && !pinch && !pointerDown) {
    needs = true;   /* a settled zoom deserves a clean redraw */
  }
  if (needs) renderLayer(now);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  if (lTag) {
    var sc = Math.pow(2, V.z - lTag.z);
    var lw = lTag.w + lTag.pad * 2, lh = lTag.h + lTag.pad * 2;
    var dstX = (-lTag.pad - W / 2) * sc + (lTag.x - V.x) * ws + W / 2;
    var dstY = (-lTag.pad - H / 2) * sc + (lTag.y - V.y) * ws + H / 2;
    ctx.drawImage(layer, dstX, dstY, lw * sc, lh * sc);
  }
  if (!needs) buildKnotClusters();   /* kept current for the live pass and for taps */

  drawWarp();
  drawFreshMarks(now);
  drawLive(now);
  drawPresence(now);
  drawDemo(now);
  drawEra();
}

/* ---------- motion: inertia, zoom easing, unweaving ---------- */
var vel = { x: 0, y: 0 }, lastMotion = 0;      /* world units per second */
var samples = [];                              /* recent {x,y,t} for a real fling */
function pushSample(x, y, t) {
  samples.push({ x: x, y: y, t: t });
  while (samples.length > 8 || (samples.length > 2 && t - samples[0].t > 110)) samples.shift();
}
function flingVelocity(now) {
  /* a finger that has been still for a moment is aiming, not throwing */
  if (samples.length < 2 || now - samples[samples.length - 1].t > 60) return { x: 0, y: 0 };
  var a = samples[0], b = samples[samples.length - 1];
  var dt = (b.t - a.t) / 1000;
  if (dt < 0.008) return { x: 0, y: 0 };
  var ws = worldSize();
  var vx = (b.x - a.x) / dt / ws, vy = (b.y - a.y) / dt / ws;
  var speed = Math.hypot(vx, vy) * ws;
  var cap = 2600;                              /* px/s — a flick, not a launch */
  if (speed > cap) { vx *= cap / speed; vy *= cap / speed; }
  return { x: vx, y: vy };
}
var unweave = { held: false };

function stepMotion(now) {
  var dt = Math.min(50, now - (lastMotion || now)); lastMotion = now;
  stepZoom(now);
  if (!pointerDown && (vel.x || vel.y)) {
    var sec = dt / 1000;
    V.x -= vel.x * sec; V.y -= vel.y * sec;
    var decay = Math.pow(0.0022, sec);          /* against the clock, not the frame */
    vel.x *= decay; vel.y *= decay;
    if (Math.abs(vel.x) * worldSize() < 6) vel.x = 0;
    if (Math.abs(vel.y) * worldSize() < 6) vel.y = 0;
    clampView(); dirty = true;
  }
  var targetWarp = traceMode ? 1 : 0;
  if (Math.abs(warp - targetWarp) > 0.005) { warp += (targetWarp - warp) * 0.14; dirty = true; weaveDirty = true; }
  else if (warp !== targetWarp) { warp = targetWarp; dirty = true; weaveDirty = true; }

  /* unweaving: hold to run the fabric backwards, release and it reweaves */
  if (Store.bounds.t1 > 0) {
    var span = Math.max(60000, Store.bounds.t1 - Store.bounds.t0);
    if (unweave.held) {
      if (timeCursor === Infinity) timeCursor = Store.bounds.t1 + 1;
      timeCursor -= span * (dt / 1000) * 0.30;      /* about three seconds to the beginning */
      if (timeCursor < Store.bounds.t0 - 1) timeCursor = Store.bounds.t0 - 1;
      dirty = true; weaveDirty = true;
    } else if (timeCursor !== Infinity) {
      timeCursor += span * (dt / 1000) * 0.45;      /* and a little over two back to now */
      if (timeCursor >= Store.bounds.t1) { timeCursor = Infinity; }
      dirty = true; weaveDirty = true;
    }
  }
}

var GB = null;  /* the edge of the drawn ground */
(function () {
  var bb = GROUND.bbox;
  if (!bb) return;
  var x0 = mercX(bb[0]), x1 = mercX(bb[2]), y0 = mercY(bb[3]), y1 = mercY(bb[1]);
  var mx = (x1 - x0) * 0.35, my = (y1 - y0) * 0.35;
  GB = { x0: x0 - mx, x1: x1 + mx, y0: y0 - my, y1: y1 + my };
})();
function clampView() {
  V.z = clamp(V.z, 9.6, 19);
  V.y = clamp(V.y, 0.02, 0.98);
  V.x = ((V.x % 1) + 1) % 1;
  /* with no tiles the ground is the drawn city; do not let anyone wander into blank paper */
  if (GB && (Tiles.off || !Tiles.anyOk)) {
    V.x = clamp(V.x, GB.x0, GB.x1);
    V.y = clamp(V.y, GB.y0, GB.y1);
  }
}

/* ============================================================
   INPUT — the map is the interface
   ============================================================ */
var traceMode = false;
var pointers = new Map();
var pointerDown = false;
var pinch = null;
var stroke = null;
var holdTimer = 0, holdCandidate = null;

var stage = document.getElementById("stage");

function ptOf(e) { return { x: e.clientX, y: e.clientY, t: performance.now() }; }

var travelled = 0;
stage.addEventListener("pointerdown", function (e) {
  if (keyOpen) return;
  travelled = 0;
  try { if (stage.setPointerCapture) stage.setPointerCapture(e.pointerId); } catch (er) { }
  var p0 = ptOf(e);
  pointers.set(e.pointerId, p0);
  pointerDown = true;
  vel.x = 0; vel.y = 0;
  samples.length = 0; pushSample(p0.x, p0.y, p0.t);

  zoomTween = null;
  if (pointers.size === 2) {
    /* two fingers always travel — cancel any nascent thread */
    if (stroke) { stroke = null; drawingPts = null; dirty = true; }
    var it = pointers.values(), a = it.next().value, b = it.next().value;
    pinch = {
      d: Math.hypot(a.x - b.x, a.y - b.y),
      mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, z: V.z,
      wx: fromScreenX((a.x + b.x) / 2), wy: fromScreenY((a.y + b.y) / 2)
    };
    clearTimeout(holdTimer);
    return;
  }
  if (pointers.size > 2) return;

  var p = p0;
  if (traceMode) {
    /* armed: the finger is laying thread. Nothing may interrupt it. */
    stroke = { pts: [fromScreenX(p.x), fromScreenY(p.y)], sx: p.x, sy: p.y, moved: 0, t0: Date.now(), last: p };
    drawingPts = stroke.pts;
  } else {
    /* travelling: a held finger pins a word to the ground */
    stroke = null;
    holdCandidate = { x: p.x, y: p.y };
    clearTimeout(holdTimer);
    holdTimer = setTimeout(function () {
      if (!holdCandidate || pointers.size !== 1) return;
      var wx = fromScreenX(holdCandidate.x), wy = fromScreenY(holdCandidate.y);
      pointers.clear(); pointerDown = false; vel.x = 0; vel.y = 0;
      openSay(holdCandidate.x, holdCandidate.y, wx, wy);
    }, HOLD_MS);
  }
  dirty = true;
}, { passive: false });

stage.addEventListener("pointermove", function (e) {
  if (!pointers.has(e.pointerId)) return;
  var prev = pointers.get(e.pointerId);
  var p = ptOf(e);
  pointers.set(e.pointerId, p);

  if (holdCandidate && Math.hypot(p.x - holdCandidate.x, p.y - holdCandidate.y) > 9) {
    clearTimeout(holdTimer); holdCandidate = null;
  }

  if (pointers.size >= 2 && pinch) {
    var it = pointers.values(), a = it.next().value, b = it.next().value;
    var d = Math.hypot(a.x - b.x, a.y - b.y);
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (pinch.d > 4) {
      V.z = clamp(pinch.z + Math.log2(d / pinch.d), 9.6, 19);
    }
    /* keep the world point under the pinch centre pinned */
    V.x = pinch.wx - (mx - W / 2) / worldSize();
    V.y = pinch.wy - (my - H / 2) / worldSize();
    clampView(); dirty = true;
    return;
  }

  if (stroke) {
    stroke.moved += Math.hypot(p.x - prev.x, p.y - prev.y);
    var wx = fromScreenX(p.x), wy = fromScreenY(p.y);
    var n = stroke.pts.length;
    var dx = (wx - stroke.pts[n - 2]) * worldSize(), dy = (wy - stroke.pts[n - 1]) * worldSize();
    if (dx * dx + dy * dy > 4) { stroke.pts.push(wx, wy); pushLive(); }
    dirty = true;
    e.preventDefault();
    return;
  }

  /* travel */
  travelled += Math.hypot(p.x - prev.x, p.y - prev.y);
  pushSample(p.x, p.y, p.t);
  var ws = worldSize();
  V.x -= (p.x - prev.x) / ws; V.y -= (p.y - prev.y) / ws;
  clampView(); dirty = true;
}, { passive: false });

function endPointer(e) {
  clearTimeout(holdTimer); holdCandidate = null;
  var had = pointers.has(e.pointerId);
  var wasPinching = !!pinch;
  pointers.delete(e.pointerId);

    pointerDown = false;
    if (!stroke && !wasPinching) { var fv = flingVelocity(performance.now()); vel.x = fv.x; vel.y = fv.y; }
    samples.length = 0;
  }
  if (!had) return;

  if (stroke) {
    var s = stroke; stroke = null;
    if (s.moved >= STROKE_MIN_PX && s.pts.length >= 4) {
      settleThread(s.pts);
      drawingPts = null;
    } else {
      drawingPts = null;
      tapAt(s.sx, s.sy);
    }
    dirty = true;
    return;
  }
  if (pointers.size === 0 && e.type === "pointerup" && !wasPinching && travelled < STROKE_MIN_PX) {
    /* a still tap while travelling: open a knot if one is there */
    tapAt(e.clientX, e.clientY);
  }

}
stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);
stage.addEventListener("pointerleave", function (e) { if (!stroke && pointers.size <= 1) endPointer(e); });

stage.addEventListener("wheel", function (e) {
  e.preventDefault();
  var wx = fromScreenX(e.clientX), wy = fromScreenY(e.clientY);
  V.z = clamp(V.z - e.deltaY * 0.0022 * (e.deltaMode === 1 ? 16 : 1), 9.6, 19);
  V.x = wx - (e.clientX - W / 2) / worldSize();
  V.y = wy - (e.clientY - H / 2) / worldSize();
  clampView(); dirty = true;
}, { passive: false });

function tapAt(sx, sy) {
  var ws = worldSize();
  var best = null, bestScore = -1;
  for (var i = 0; i < renderedKnots.length; i++) {
    var kn = renderedKnots[i];
    var d = Math.hypot((kn.x - V.x) * ws + W / 2 - sx, (kn.y - V.y) * ws + H / 2 - sy);
    var r = knotRadius(kn.w);
    var reach = Math.max(26, r + 14);
    if (d < reach) { var score = (reach - d) + kn.w * 0.3; if (score > bestScore) { bestScore = score; best = kn; } }
  }

}

/* ---------- leaving a thread ---------- */
function settleThread(mercPts) {
  var packed = [];
  for (var i = 0; i < mercPts.length; i += 2) {
    packed.push(Math.round(unMercY(mercPts[i + 1]) * 1e5), Math.round(unMercX(mercPts[i]) * 1e5));
  }
  writeLS("cg.where." + GID, JSON.stringify([V.x, V.y, Math.max(V.z, 14.2), Date.now()]));
  var op = { i: opId(), a: ME, t: Date.now(), k: "t", d: { p: packed } };
  addOp(op); saveLocal(); publish([op]);
  lastMine = op.i; showUndo(); syncPips(); refreshMyFibre(); publishCloth(6000);
  dirty = true;
}

/* ---------- saying something into place ---------- */
var say = document.getElementById("say");
var sayIn = document.getElementById("sayIn");
var micBtn = document.getElementById("mic");
var sayAt = null, recog = null;

var sayReady = false, sayOpened = 0;
function openSay(sx, sy, wx, wy) {
  sayAt = { x: wx, y: wy };
  sayReady = false;
  sayOpened = performance.now();
  say.style.display = "block";
  var nearRight = sx > W - 170;
  say.classList.toggle("flip", nearRight);
  say.style.left = clamp(sx, 46, W - 46) + "px";
  say.style.top = clamp(sy - 26, 44, H - 130) + "px";
  sayIn.value = "";
  syncMicGlyph();

  /* The finger that opened this is still on the glass. Focusing now means the
     keyboard steals it and the lift blurs it straight back out. Wait for the lift. */
  function arm() {
    window.removeEventListener("pointerup", arm, true);
    window.removeEventListener("touchend", arm, true);
    clearTimeout(armFallback);
    setTimeout(function () {
      if (!sayAt) return;
      sayReady = true;
      try { sayIn.focus(); } catch (e) { }
    }, 30);
  }
  var armFallback = setTimeout(arm, 700);
  window.addEventListener("pointerup", arm, true);
  window.addEventListener("touchend", arm, true);
}
function closeSay(commit) {
  sayReady = false;
  if (recog) { try { recog.stop(); } catch (e) { } recog = null; micBtn.classList.remove("on"); }
  var text = sayIn.value.trim();
  say.style.display = "none";
  if (commit && text && sayAt) {
    var op = {
      i: opId(), a: ME, t: Date.now(), k: "n",
      d: { ll: [Math.round(unMercY(sayAt.y) * 1e5), Math.round(unMercX(sayAt.x) * 1e5)], x: text.slice(0, 140) }
    };
    addOp(op); saveLocal(); publish([op]);
    lastMine = op.i; showUndo(); syncPips(); refreshMyFibre(); publishCloth(6000);
  }
  sayAt = null; sayIn.blur(); dirty = true;
}
sayIn.addEventListener("keydown", function (e) {
  if (e.key === "Enter") { e.preventDefault(); closeSay(true); }
  else if (e.key === "Escape") { closeSay(false); }
});
sayIn.addEventListener("blur", function () {
  setTimeout(function () {
    if (!sayReady || performance.now() - sayOpened < 700) return;   /* not a real dismissal */
    if (say.style.display === "block") closeSay(true);
  }, 140);
});
/* with something written, the glyph becomes the way to throw it away */
function syncMicGlyph() {
  var has = sayIn.value.trim().length > 0;
  document.getElementById("micVoice").style.display = has ? "none" : "";
  document.getElementById("micDrop").style.display = has ? "" : "none";

/* A stroke at metro scale is ten kilometres of freehand line, which can only
   ever lie across the city rather than in it. Reaching for the thread brings
   you down to the scale where a gesture can follow a street. */
var zoomTween = null;
function easeZoomTo(z, ms) {
  if (V.z >= z - 0.05) return;
  zoomTween = { from: V.z, to: z, t0: performance.now(), ms: ms || 620 };
  dirty = true;
}
function stepZoom(now) {
  if (!zoomTween) return;
  var k = clamp((now - zoomTween.t0) / zoomTween.ms, 0, 1);
  var e = 1 - Math.pow(1 - k, 3);
  V.z = zoomTween.from + (zoomTween.to - zoomTween.from) * e;
  clampView();
  dirty = true; weaveDirty = true;
  if (k >= 1) zoomTween = null;
}

/* ---------- QR (byte mode, level M, versions 1-10) ---------- */
var QR = (function () {
  var EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (function () { var x = 1; for (var i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; } for (var j = 255; j < 512; j++) EXP[j] = EXP[j - 255]; })();
  function mul(a, b) { return (a && b) ? EXP[LOG[a] + LOG[b]] : 0; }
  function gen(n) { var g = [1]; for (var i = 0; i < n; i++) { var ng = new Array(g.length + 1).fill(0); for (var j = 0; j < g.length; j++) { ng[j] ^= g[j]; ng[j + 1] ^= mul(g[j], EXP[i]); } g = ng; } return g; }
  function ecc(data, n) { var g = gen(n), r = new Uint8Array(data.length + n); r.set(data); for (var i = 0; i < data.length; i++) { var c = r[i]; if (c) for (var j = 0; j <= n; j++) r[i + j] ^= mul(g[j], c); } return r.subarray(data.length); }
  var RS = { 1: [10, [[1, 16]]], 2: [16, [[1, 28]]], 3: [26, [[1, 44]]], 4: [18, [[2, 32]]], 5: [24, [[2, 43]]], 6: [16, [[4, 27]]], 7: [18, [[4, 31]]], 8: [22, [[2, 38], [2, 39]]], 9: [22, [[3, 36], [2, 37]]], 10: [26, [[4, 43], [1, 44]]] };
  var ALIGN = { 1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30], 6: [6, 34], 7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50] };
  function bitlen(v) { var n = 0; while (v) { n++; v >>>= 1; } return n; }
  function fmtBits(mask) { var d = (0 << 3) | mask; var r = d << 10; while (bitlen(r) >= 11) r ^= 0b10100110111 << (bitlen(r) - 11); return ((d << 10) | r) ^ 0b101010000010010; }
  function verBits(v) { var r = v << 12; while (bitlen(r) >= 13) r ^= 0b1111100100101 << (bitlen(r) - 13); return (v << 12) | r; }

  return function (text) {
    var bytes = [];
    for (var i = 0; i < text.length; i++) {
      var c = text.charCodeAt(i);
      if (c < 128) bytes.push(c);
      else if (c < 2048) bytes.push(192 | (c >> 6), 128 | (c & 63));
      else bytes.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63));
    }
    var ver = 0;
    for (var v = 1; v <= 10; v++) {
      var total = RS[v][1].reduce(function (a, g) { return a + g[0] * g[1]; }, 0);
      if (bytes.length + (v < 10 ? 2 : 3) <= total) { ver = v; break; }
    }
    if (!ver) return null;
    var ecn = RS[ver][0], groups = RS[ver][1];
    var totalData = groups.reduce(function (a, g) { return a + g[0] * g[1]; }, 0);

    /* bitstream */
    var bits = [];
    function put(val, n) { for (var i = n - 1; i >= 0; i--) bits.push((val >> i) & 1); }
    put(4, 4);
    put(bytes.length, ver < 10 ? 8 : 16);
    for (var b = 0; b < bytes.length; b++) put(bytes[b], 8);
    var cap = totalData * 8;
    for (var t = 0; t < 4 && bits.length < cap; t++) bits.push(0);
    while (bits.length % 8) bits.push(0);
    var cw = [];
    for (var i2 = 0; i2 < bits.length; i2 += 8) { var byte = 0; for (var k = 0; k < 8; k++) byte = (byte << 1) | bits[i2 + k]; cw.push(byte); }
    var pad = [0xEC, 0x11], pi = 0;
    while (cw.length < totalData) cw.push(pad[pi++ % 2]);

    /* blocks */
    var dblocks = [], eblocks = [], pos = 0;
    for (var gi = 0; gi < groups.length; gi++) {
      for (var bi = 0; bi < groups[gi][0]; bi++) {
        var d = Uint8Array.from(cw.slice(pos, pos + groups[gi][1])); pos += groups[gi][1];
        dblocks.push(d); eblocks.push(ecc(d, ecn));
      }
    }
    var final = [];
    var maxD = Math.max.apply(null, dblocks.map(function (d) { return d.length; }));
    for (var c2 = 0; c2 < maxD; c2++) for (var bl = 0; bl < dblocks.length; bl++) if (c2 < dblocks[bl].length) final.push(dblocks[bl][c2]);
    for (var c3 = 0; c3 < ecn; c3++) for (var bl2 = 0; bl2 < eblocks.length; bl2++) final.push(eblocks[bl2][c3]);

    /* matrix */
    var size = 17 + 4 * ver;
    var m = [], fn = [];
    for (var r = 0; r < size; r++) { m.push(new Uint8Array(size)); fn.push(new Uint8Array(size)); }
    function setF(r, c, v) { if (r < 0 || c < 0 || r >= size || c >= size) return; m[r][c] = v; fn[r][c] = 1; }
    function finder(r0, c0) {
      for (var r = -1; r <= 7; r++) for (var c = -1; c <= 7; c++) {
        var rr = r0 + r, cc = c0 + c;
        if (rr < 0 || cc < 0 || rr >= size || cc >= size) continue;
        var on = (r >= 0 && r <= 6 && (c === 0 || c === 6)) || (c >= 0 && c <= 6 && (r === 0 || r === 6)) || (r >= 2 && r <= 4 && c >= 2 && c <= 4);
        setF(rr, cc, on ? 1 : 0);
      }
    }
    finder(0, 0); finder(0, size - 7); finder(size - 7, 0);
    for (var i3 = 8; i3 < size - 8; i3++) { setF(6, i3, i3 % 2 === 0 ? 1 : 0); setF(i3, 6, i3 % 2 === 0 ? 1 : 0); }
    var ac = ALIGN[ver];
    for (var a1 = 0; a1 < ac.length; a1++) for (var a2 = 0; a2 < ac.length; a2++) {
      var ar = ac[a1], acol = ac[a2];
      if ((ar <= 7 && acol <= 7) || (ar <= 7 && acol >= size - 8) || (ar >= size - 8 && acol <= 7)) continue;
      for (var r2 = -2; r2 <= 2; r2++) for (var c4 = -2; c4 <= 2; c4++) {
        setF(ar + r2, acol + c4, (Math.max(Math.abs(r2), Math.abs(c4)) !== 1) ? 1 : 0);
      }
    }
    setF(size - 8, 8, 1);
    /* reserve format */
    for (var i4 = 0; i4 < 9; i4++) { if (i4 !== 6) { setF(8, i4, 0); setF(i4, 8, 0); } }
    for (var i5 = 0; i5 < 8; i5++) { setF(8, size - 1 - i5, 0); setF(size - 1 - i5, 8, 0); }
    if (ver >= 7) {
      var vb = verBits(ver);
      for (var i6 = 0; i6 < 18; i6++) {
        var bit = (vb >> i6) & 1;
        setF(Math.floor(i6 / 3), size - 11 + (i6 % 3), bit);
        setF(size - 11 + (i6 % 3), Math.floor(i6 / 3), bit);
      }
    }
    /* data zigzag */
    var bi2 = 0, up = true;
    var dataBits = [];
    for (var f = 0; f < final.length; f++) for (var k2 = 7; k2 >= 0; k2--) dataBits.push((final[f] >> k2) & 1);
    for (var col = size - 1; col > 0; col -= 2) {
      if (col === 6) col--;
      for (var rowi = 0; rowi < size; rowi++) {
        var row = up ? size - 1 - rowi : rowi;
        for (var s2 = 0; s2 < 2; s2++) {
          var cc2 = col - s2;
          if (fn[row][cc2]) continue;
          m[row][cc2] = bi2 < dataBits.length ? dataBits[bi2] : 0;
          bi2++;
        }
      }
      up = !up;
    }
    /* masks */
    function maskFn(k, r, c) {
      switch (k) {
        case 0: return (r + c) % 2 === 0;
        case 1: return r % 2 === 0;
        case 2: return c % 3 === 0;
        case 3: return (r + c) % 3 === 0;
        case 4: return (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0;
        case 5: return ((r * c) % 2) + ((r * c) % 3) === 0;
        case 6: return (((r * c) % 2) + ((r * c) % 3)) % 2 === 0;
        default: return (((r + c) % 2) + ((r * c) % 3)) % 2 === 0;
      }
    }
    function penalty(mm) {
      var p = 0, r, c, run, i;
      for (r = 0; r < size; r++) { run = 1; for (c = 1; c < size; c++) { if (mm[r][c] === mm[r][c - 1]) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; } }
      for (c = 0; c < size; c++) { run = 1; for (r = 1; r < size; r++) { if (mm[r][c] === mm[r - 1][c]) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; } }
      for (r = 0; r < size - 1; r++) for (c = 0; c < size - 1; c++) { var s3 = mm[r][c] + mm[r][c + 1] + mm[r + 1][c] + mm[r + 1][c + 1]; if (s3 === 0 || s3 === 4) p += 3; }
      var dark = 0; for (r = 0; r < size; r++) for (c = 0; c < size; c++) dark += mm[r][c];
      p += Math.floor(Math.abs(dark * 100 / (size * size) - 50) / 5) * 10;
      return p;
    }
    var best = null, bestP = Infinity;
    for (var mk = 0; mk < 8; mk++) {
      var mm = m.map(function (row) { return Uint8Array.from(row); });
      for (var r3 = 0; r3 < size; r3++) for (var c5 = 0; c5 < size; c5++) if (!fn[r3][c5] && maskFn(mk, r3, c5)) mm[r3][c5] ^= 1;
      var fb = fmtBits(mk);
      for (var i7 = 0; i7 < 15; i7++) {
        var bit2 = (fb >> i7) & 1;

        if (i7 < 6) mm[i7][8] = bit2;
        else if (i7 === 6) mm[7][8] = bit2;
        else if (i7 === 7) mm[8][8] = bit2;
        else if (i7 === 8) mm[8][7] = bit2;
        else mm[8][14 - i7] = bit2;
        /* second copy: in from the right along row 8, then up column 8 */
        if (i7 < 8) mm[8][size - 1 - i7] = bit2;
        else mm[size - 15 + i7][8] = bit2;

      mm[size - 8][8] = 1;
      var pp = penalty(mm);
      if (pp < bestP) { bestP = pp; best = mm; }
    }
    return best;
  };
})();

function drawQR(canvas, text) {
  var m = QR(text);
  if (!m) return;
  var n = m.length, quiet = 3, total = n + quiet * 2;
  var css = canvas.clientWidth || 240;
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(css * dpr); canvas.height = Math.round(css * dpr);
  var g = canvas.getContext("2d");
  var s = canvas.width / total;
  g.fillStyle = PAPER; g.fillRect(0, 0, canvas.width, canvas.height);
  /* Solid modules, no gaps. A gap of even a twentieth of a module is enough to
     make a strict decoder refuse the square, and this square has to scan. */
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
    if (!m[r][c]) continue;
    var inFinder = (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
    g.fillStyle = inFinder ? "#bf4526" : "#1d201d";
    g.fillRect(Math.floor((c + quiet) * s), Math.floor((r + quiet) * s), Math.ceil(s) + 1, Math.ceil(s) + 1);
  }
}

/* ============================================================
   NETWORK — the ground tries to find the others. Never required.
   ============================================================ */
var net = { state: "local", mqtt: null, bc: null, tried: 0 };

function handleMsg(raw) { try { handleMsgInner(raw); } catch (e) { /* one bad message is one bad message */ } }
function handleMsgInner(msg) {
  if (!msg || typeof msg !== "object" || msg.from === SITE || msg.g !== GID) return;
  if (msg.ops && !Array.isArray(msg.ops)) return;
  if (msg.cloth) {
    /* the folded cloth, handed over on arrival */
    GOT_CLOTH = true;
    var wasEmpty = !Store.threads.length;
    var got = 0;
    for (var ci = 0; ci < msg.ops.length; ci++) if (addOp(msg.ops[ci], { animate: false })) got++;
    if (got) { saveLocal(); syncPips(); refreshMyFibre(); }
    if (got && wasEmpty && !readLS("cg.where." + GID, "")) frameTheWeave();
    if (Store.ops.length > (msg.n || 0)) publishCloth(3000 + Math.random() * 4000);
    return;
  }
  if (msg.ops) {
    var added = 0;
    for (var i = 0; i < msg.ops.length; i++) {
      var op = msg.ops[i];
      if (op.k === "x") { if (removeOp(op.d.r, op.a)) added++; continue; }
      if (addOp(op, { animate: true })) added++;
    }
    if (added) { saveLocal(); syncPips(); refreshMyFibre(); publishCloth(12000 + Math.random() * 8000); }
  }
  if (msg.hello || msg.helloBack) {
    /* someone arrived: send them what they are missing, and say what we hold
       so they can send us what we are missing */
    var have = msg.have || {};
    var missing = Store.ops.filter(function (o) {
      var parts = o.i.split(".");
      return !(have[parts[0]] >= parseInt(parts[1] || "0", 36));
    });
    if (missing.length) publishChunked(missing.slice(-1200));
    if (msg.hello) setTimeout(function () { send({ g: GID, from: SITE, helloBack: 1, have: haveVector() }); }, 60 + Math.random() * 260);
  }
  if (msg.pres) {
    var who = msg.pres.a || msg.from;
    var p = peers.get(who) || {};
    p.c = msg.pres.c; p.x = msg.pres.x; p.y = msg.pres.y; p.ts = performance.now();
    peers.set(who, p);
    refreshPeopleGlyph(); syncPips(); dirty = true;
  }
  if (msg.live) {
    var who2 = msg.live.a || msg.from;
    var lp = livePeers.get(who2) || { pts: [], c: colorOf(who2) };
    var conv = [];
    for (var j = 0; j + 1 < msg.live.p.length; j += 2) conv.push(mercX(msg.live.p[j + 1] / 1e5), mercY(msg.live.p[j] / 1e5));
    lp.pts = conv; lp.ts = performance.now();
    livePeers.set(who2, lp);
    dirty = true;
  }
}

/* ---- where the cloth rests ----
   Gossip only reaches people who are awake at the same moment. A city is not
   used that way. Whoever weaves last leaves the whole cloth folded on the
   meeting point, so somebody arriving an hour later is handed the place rather
   than told it is empty. */
var snapTimer = 0, GOT_CLOTH = false;
function publishCloth(delay) {
  clearTimeout(snapTimer);
  snapTimer = setTimeout(function () {
    if (!net.mqtt || !net.mqtt.ready || !Store.ops.length) return;
    var ops = Store.ops;
    if (ops.length > 1500) ops = ops.slice(ops.length - 1500);
    var body = JSON.stringify({ g: GID, from: SITE, cloth: 1, n: Store.ops.length, ops: ops });
    while (body.length > 280000 && ops.length > 40) {
      ops = ops.slice(Math.floor(ops.length * 0.3));
      body = JSON.stringify({ g: GID, from: SITE, cloth: 1, n: Store.ops.length, ops: ops });
    }
    try { net.mqtt.publishRetained(body); } catch (e) { }
  }, delay);
}

/* stand in front of what is already here, rather than above the whole county */
function frameTheWeave() {
  if (!Store.threads.length) return;
  var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (var i = 0; i < Store.threads.length; i++) {
    var t = Store.threads[i];
    if (t.bx0 < x0) x0 = t.bx0; if (t.bx1 > x1) x1 = t.bx1;
    if (t.by0 < y0) y0 = t.by0; if (t.by1 > y1) y1 = t.by1;
  }
  if (!isFinite(x0)) return;
  V.x = (x0 + x1) / 2; V.y = (y0 + y1) / 2;
  var span = Math.max(x1 - x0, (y1 - y0) * (W / Math.max(1, H)), 1e-6);
  var z = Math.log2((W * 0.78) / (span * 256));
  V.z = clamp(z, 11, 16.5);
  clampView(); touchWeave();
}

function haveVector() {
  var have = {};
  Store.ops.forEach(function (o) {
    var parts = o.i.split(".");
    var n = parseInt(parts[1] || "0", 36);
    if (!(have[parts[0]] >= n)) have[parts[0]] = n;
  });
  return have;
}
function publish(ops) { send({ g: GID, from: SITE, ops: ops }); }
function publishChunked(ops) {
  for (var i = 0; i < ops.length; i += 40) {
    (function (slice, k) {
      setTimeout(function () { publish(slice); }, k * 45);
    })(ops.slice(i, i + 40), i / 40);
  }
}
function send(msg) {
  var s = JSON.stringify(msg);
  try { if (net.bc) net.bc.postMessage(s); } catch (e) { }
  try { if (net.mqtt && net.mqtt.ready) net.mqtt.publish(s); } catch (e) { }
}

/* same device, other tabs — always available */
try {
  net.bc = new BroadcastChannel("cg." + GID);
  net.bc.onmessage = function (e) { try { handleMsg(JSON.parse(e.data)); } catch (er) { } };
} catch (e) { net.bc = null; }

/* ---------- minimal MQTT 3.1.1 over WebSocket ---------- */
function MqttClient(url, topic, snapTopic, onMsg, onOpen, onFail) {
  var ws, ready = false, pingTimer = 0, self = this;
  var cid = "cg" + ME + Math.random().toString(36).slice(2, 7);
  function enc(str) { return new TextEncoder().encode(str); }
  function rem(len) { var out = []; do { var d = len % 128; len = Math.floor(len / 128); if (len > 0) d |= 128; out.push(d); } while (len > 0); return out; }
  function pack(type, flags, payload) {
    var head = [(type << 4) | flags].concat(rem(payload.length));
    var buf = new Uint8Array(head.length + payload.length);
    buf.set(head, 0); buf.set(payload, head.length);
    return buf;
  }
  function strBuf(s) { var b = enc(s); var o = new Uint8Array(b.length + 2); o[0] = b.length >> 8; o[1] = b.length & 255; o.set(b, 2); return o; }
  function cat() { var parts = [].slice.call(arguments); var n = parts.reduce(function (a, p) { return a + p.length; }, 0); var o = new Uint8Array(n), off = 0; for (var i = 0; i < parts.length; i++) { o.set(parts[i], off); off += parts[i].length; } return o; }

  try { ws = new WebSocket(url, ["mqtt"]); } catch (e) { onFail && onFail(); return; }
  ws.binaryType = "arraybuffer";
  var failed = false;
  var guard = setTimeout(function () { if (!ready) { failed = true; try { ws.close(); } catch (e) { } onFail && onFail(); } }, 7000);

  ws.onopen = function () {
    var vh = cat(strBuf("MQTT"), new Uint8Array([4, 0x02, 0, 30]));
    ws.send(pack(1, 0, cat(vh, strBuf(cid))));
  };
  ws.onerror = function () { if (!failed) { failed = true; clearTimeout(guard); onFail && onFail(); } };
  ws.onclose = function () { ready = false; self.ready = false; if (!failed) { failed = true; clearTimeout(guard); onFail && onFail(); } };
  /* a websocket frame is not an mqtt packet: brokers split and coalesce freely,
     so everything arriving is treated as one continuous stream */
  var inbuf = new Uint8Array(0);
  function feed(chunk) {
    if (inbuf.length) {
      var merged = new Uint8Array(inbuf.length + chunk.length);
      merged.set(inbuf, 0); merged.set(chunk, inbuf.length);
      inbuf = merged;
    } else inbuf = chunk;
    var off = 0;
    for (;;) {
      if (inbuf.length - off < 2) break;
      var type = inbuf[off] >> 4;
      var mult = 1, len = 0, j = off + 1, byte, bytes = 0, complete = false;
      do {
        if (j >= inbuf.length) break;
        byte = inbuf[j++]; len += (byte & 127) * mult; mult *= 128; bytes++;
        if (!(byte & 128)) { complete = true; break; }
      } while (bytes < 4);
      if (!complete) break;
      if (inbuf.length - j < len) break;                 /* wait for the rest */
      handlePacket(type, inbuf.subarray(j, j + len));
      off = j + len;
      if (closedOut) return;
    }
    inbuf = off ? inbuf.subarray(off) : inbuf;
  }
  var closedOut = false;
  function handlePacket(type, body) {
    if (type === 2) {                                     /* CONNACK */
      if (body.length >= 2 && body[1] === 0) {
        ready = true; self.ready = true; clearTimeout(guard);
        /* the live gossip, and the ground's own resting place */
        ws.send(pack(8, 2, cat(new Uint8Array([0, 1]),
          strBuf(topic), new Uint8Array([0]),
          strBuf(snapTopic), new Uint8Array([0]))));
        pingTimer = setInterval(function () { try { ws.send(new Uint8Array([0xC0, 0])); } catch (e) { } }, 20000);
        onOpen && onOpen();
      } else { closedOut = true; failed = true; clearTimeout(guard); try { ws.close(); } catch (e) { } onFail && onFail(); }
    } else if (type === 3) {                              /* PUBLISH */
      if (body.length < 2) return;
      var tl = (body[0] << 8) | body[1];
      var payload = body.subarray(2 + tl);
      try { onMsg(new TextDecoder().decode(payload)); } catch (e) { }
    }
  }
  ws.onmessage = function (ev) {
    try {
      var d = typeof ev.data === "string" ? new TextEncoder().encode(ev.data) : new Uint8Array(ev.data);
      feed(d);
    } catch (e) { }
  };
  this.ready = false;
  this.publish = function (str) {
    if (!ready) return;
    try { ws.send(pack(3, 0, cat(strBuf(topic), enc(str)))); } catch (e) { }
  };
  /* A retained message is the only thing on a public broker that outlives the
     people holding it. It is where the cloth rests between visits. */
  this.publishRetained = function (str) {
    if (!ready) return;
    try { ws.send(pack(3, 1, cat(strBuf(snapTopic), enc(str)))); } catch (e) { }
  };
  this.close = function () { clearInterval(pingTimer); try { ws.close(); } catch (e) { } };
}

var BROKERS = (function () {
  /* a ground can name its own meeting point; otherwise it asks the public ones */
  var q = new URLSearchParams(location.search).get("broker");
  if (q && /^wss?:\/\//.test(q)) return [q];
  return [
    "wss://broker.emqx.io:8084/mqtt",
    "wss://test.mosquitto.org:8081/mqtt",
    "wss://broker.hivemq.com:8884/mqtt"
  ];
})();
function connectNet() {
  if (net.tried >= BROKERS.length || net.state === "open") return;
  var url = BROKERS[net.tried++];
  var topic = "unsettled-atlas/commonground/" + GID;
  net.mqtt = new MqttClient(url, topic, topic + "/cloth",
    function (s) { try { handleMsg(JSON.parse(s)); } catch (e) { } },
    function () {
      net.state = "open";
      send({ g: GID, from: SITE, hello: 1, have: haveVector() });
      sendPresence();
      /* nothing was left here: leave it now */
      setTimeout(function () { if (!GOT_CLOTH && Store.ops.length) publishCloth(200); }, 3500);
    },
    function () { net.state = "local"; net.mqtt = null; setTimeout(connectNet, 600); }
  );
}

function sendPresence() {
  send({ g: GID, from: SITE, pres: { a: ME, c: MY_COLOR, x: V.x, y: V.y } });
}
setInterval(function () { if (net.mqtt && net.mqtt.ready) sendPresence(); }, 4000);

var liveTimer = 0;
function pushLive() {
  if (liveTimer) return;
  liveTimer = setTimeout(function () {
    liveTimer = 0;
    if (!drawingPts || drawingPts.length < 4) return;
    var p = [];
    var step = Math.max(1, Math.floor(drawingPts.length / 2 / 60));
    for (var i = 0; i < drawingPts.length; i += 2 * step) {
      p.push(Math.round(unMercY(drawingPts[i + 1]) * 1e5), Math.round(unMercX(drawingPts[i]) * 1e5));
    }
    send({ g: GID, from: SITE, live: { a: ME, p: p } });
  }, 130);
}

/* reconnect when the device comes back */
window.addEventListener("online", function () { if (net.state !== "open") { net.tried = 0; connectNet(); } });
document.addEventListener("visibilitychange", function () {
  if (!document.hidden && net.state !== "open") { net.tried = 0; connectNet(); }
});

/* ============================================================
   BOOT
   ============================================================ */
function boot() {
  /* the loop starts first; nothing below it may ever stop the ground appearing */
  requestAnimationFrame(frame);
  try { bootGround(); } catch (e) { dirty = true; }
}

function bootGround() {
  resize();
  window.addEventListener("resize", resize);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);

  /* the place you were last weaving is where you come back to */
  try {
    var whereRaw = readLS("cg.where." + GID, "");
    if (whereRaw) {
      var wh = JSON.parse(whereRaw);
      if (wh && wh.length === 4 && isFinite(wh[0]) && Date.now() - wh[3] < 120 * 864e5) {
        V.x = wh[0]; V.y = wh[1]; V.z = clamp(wh[2], 9.6, 19);
      }
    }
  } catch (e) { }

  /* restore the ground */
  var lastVisit = parseInt(readLS(LS_VISIT, "0"), 10) || 0;
  LAST_VISIT = lastVisit;
  var saved = loadLocal();
  var sortedSaved = saved.slice().sort(function (a, b) { return (a.t || 0) - (b.t || 0); });
  var fresh = 0;
  for (var i = 0; i < sortedSaved.length; i++) {
    var op = sortedSaved[i];
    addOp(op, { animate: lastVisit > 0 && op.t > lastVisit, stagger: Math.min(1.6, fresh++ * 0.22) });
  }
  writeLS(LS_VISIT, String(Date.now()));

  /* frame first, everything else after */
  refreshMyFibre();
  setTrace(false);
  refreshPeopleGlyph();
  syncPips();
  dirty = true;

  /* a mark you made a moment ago can still be taken back after a reload */
  for (var m = Store.ops.length - 1; m >= 0; m--) {
    if (Store.ops[m].a !== ME) continue;
    if (Date.now() - Store.ops[m].t < 3 * 60000) { lastMine = Store.ops[m].i; showUndo(); }
    break;
  }

  /* say hello to any other client on this device straight away */
  try { send({ g: GID, from: SITE, hello: 1, have: haveVector() }); } catch (e) { }
  setTimeout(function () { try { connectNet(); } catch (e) { } }, 700);
}

/* moving to another ground is moving to another place */
window.addEventListener("hashchange", function () {
  if (readGroundId() !== GID) location.reload();
});

window.addEventListener("keydown", function (e) {
  if (e.key === "z" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); if (lastMine) undoBtn.click(); }
  if (e.key === "Escape") { openKnot = null; keyOpen = false; keyEl.classList.remove("show"); dirty = true; }
});

window.addEventListener("error", function () { /* never let a stray error blank the ground */ });

boot();
</script>
