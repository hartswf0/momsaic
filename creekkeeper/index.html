function freePose(lm,seen,t){

async function loadPoseModel(){

 let err;
 for(const base of bases){try{
  let mod;try{mod=await import(base+'/vision_bundle.mjs')}catch(e){mod=await import(base)}
  const fileset=await mod.FilesetResolver.forVisionTasks(base+'/wasm');
  options.baseOptions.delegate='GPU';
  try{return await mod.PoseLandmarker.createFromOptions(fileset,options)}
  catch(e){options.baseOptions.delegate='CPU';return await mod.PoseLandmarker.createFromOptions(fileset,options)}

}
function prepareModel(){

function startCameraGame(){if(!setup||!stream||!setup.target)return;input='camera';mode=setup.mode;limit=setup.limit;count=0;session={base:setup.neutral.v,delta:setup.target.v-setup.neutral.v,state:'needNeutral',hits:0,smooth:null,lastCount:0};phase='playing';paused=false;lastGood=performance.now();resetScene();setMeter(0);hidePanel();renderHUD()}
function consumeMetric(v,t){if(!session||phase!=='playing'||paused||input!=='camera'||document.hidden)return;let s=session;if(!Number.isFinite(v))return;let p=(v-s.base)/s.delta;s.smooth=s.smooth===null?p:s.smooth*.40+p*.60;let x=s.smooth;setMeter(clamp(x));let need=2;if(x>1.35||x<-.45){s.state='needNeutral';s.hits=0;$('hint').textContent='Return to the recorded start.';return}let pass=s.state==='target'?x>=.72&&x<=1.22:x>=-.26&&x<=.26;if(pass)s.hits++;else s.hits=0;if(s.hits>=need){s.hits=0;if(s.state==='needNeutral'){s.state='target';$('hint').textContent='Your approved movement.'}else if(s.state==='target'){s.state='return';$('hint').textContent='Return to the start.'}else if(s.state==='return'){if(t-s.lastCount>650){s.lastCount=t;reward()}s.state='target';if(phase==='playing')$('hint').textContent='Your approved movement.'}}}
function runPose(token){if(token!==runToken||!stream||!landmarker)return;const loop=t=>{if(token!==runToken||!stream)return;let valid=false;if(VIDEO.readyState>=2&&t-lastInfer>=125&&VIDEO.currentTime!==lastVideoTime){lastInfer=t;lastVideoTime=VIDEO.currentTime;try{let stamp=Math.max(performance.now(),lastInferStamp+.01);lastInferStamp=stamp;let r=landmarker.detectForVideo(VIDEO,stamp);let lm=r.landmarks?.[0];lastPose=lm||null;renderPose(lastPose);if(phase==='free'||phase==='preview'||phase==='setup'){let seen=!!lm&&lm.filter(p=>(p.visibility??1)>.5).length>=5;if(seen)lastGood=performance.now();updateCameraLabel(seen);if(phase==='free')freePose(lm,seen,t);}else{let v=metric(lm,setup?.mode,setup?.side,VIDEO.videoWidth,VIDEO.videoHeight);valid=v!==null&&Number.isFinite(v);if(valid){lastGood=performance.now();lastMetric=v;calSamples.push({t:lastGood,v});calSamples=calSamples.filter(s=>lastGood-s.t<=1250);updateCameraLabel(true);if(phase==='calibrate')setCalButtons();consumeMetric(v,lastGood)}else{lastMetric=null;calSamples=[];updateCameraLabel(false);if(session&&phase==='playing'){session.state='needNeutral';session.hits=0;session.smooth=null;setMeter(0)}if(phase==='calibrate')setCalButtons()}}}catch(e){if(phase==='free'&&$('freeStatus'))$('freeStatus').textContent='TRACKING ERROR';if(phase==='preview'&&$('previewStatus'))$('previewStatus').textContent='Pose inference failed. Camera remains available.';lastMetric=null;calSamples=[];updateCameraLabel(false);if(session&&phase==='playing'){session.state='needNeutral';session.hits=0;session.smooth=null;setMeter(0)}}}let elapsed=performance.now()-lastGood;if(elapsed>500){if(trackStatus){updateCameraLabel(false);if(phase==='calibrate')setCalButtons()}if(session&&phase==='playing'){session.state='needNeutral';session.hits=0;session.smooth=null;setMeter(0)}}if(input==='camera'&&phase==='playing'&&elapsed>1200){pausePanel('Tracking lost. A helper should check the camera before resuming.')}if(token===runToken&&stream)rafPose=requestAnimationFrame(loop)};rafPose=requestAnimationFrame(loop)}
// No score while the app is hidden. End camera access when navigating away.
document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='free'&&(stream||loading)){welcome();return}if(document.hidden&&phase==='playing'){pausePanel('The game was interrupted. Resume when ready.')}});window.addEventListener('pagehide',stopCamera);window.addEventListener('keydown',e=>{if(e.key==='Escape'&&phase==='playing'){e.preventDefault();pausePanel()}if(e.code==='Space'&&phase==='playing'&&input==='demo'&&e.target===document.body){e.preventDefault();reward()}});
$('cameraCheck').innerHTML=icon('cam');
$('cameraCheck').onclick=()=>{if(phase==='free'){if(stream){$('cam').classList.toggle('expanded')}else quickCamera();return}if(input==='camera'&&stream&&phase==='playing'){$('cam').classList.toggle('expanded');return}if(phase==='playing'&&input==='demo'){welcome();quickCamera();return}if(!stream&&!loading){welcome();quickCamera()}};
$('cam').onclick=()=>{if(phase==='free'||(input==='camera'&&phase==='playing'))$('cam').classList.toggle('expanded')};
welcome();
