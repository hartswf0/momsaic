<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12343a">
<title>Riffle</title>
<style>
:root{--ink:#0e2226;--deep:#12343a;--cream:#f6f0e0;--amber:#f2b84b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--deep);color:var(--cream);overflow:hidden;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#vid{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#home{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:min(2.2vh,16px);padding:16px 16px max(18px,env(safe-area-inset-bottom));background:linear-gradient(transparent 26%,#12343ad9 44%,#0e2226 78%)}
#home[hidden],#setup[hidden],#x[hidden],#title[hidden]{display:none}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;padding:0 16px max(26px,env(safe-area-inset-bottom))}
#go{border:0;border-radius:60px;background:var(--amber);color:var(--ink);font-family:inherit;font-weight:800;font-size:clamp(26px,8vmin,40px);line-height:1;letter-spacing:.14em;padding:.62em 1.5em .62em 1.64em;box-shadow:0 7px 0 #a8791f,0 0 0 0 #f2b84b88;cursor:pointer;animation:pulse 1.8s ease-out infinite}
#go:active{transform:translateY(5px);box-shadow:0 2px 0 #a8791f}
@keyframes pulse{70%{box-shadow:0 7px 0 #a8791f,0 0 0 22px #f2b84b00}100%{box-shadow:0 7px 0 #a8791f,0 0 0 0 #f2b84b00}}
#place{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;background:#0e2226f2;overflow-y:auto}
#place[hidden],#skip[hidden]{display:none}
#place h2{margin:0 0 4px;font-size:clamp(20px,6vmin,30px);letter-spacing:.1em;text-align:center}
.pc{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center;width:min(94vw,470px);border:3px solid transparent;border-radius:22px;padding:8px 14px 8px 8px;background:linear-gradient(#2a6a6c,#1b4e55);color:var(--cream);text-align:left;font-family:inherit;cursor:pointer;box-shadow:0 5px 0 #0c2a2f}
.pc.on{border-color:var(--amber)}
.pc:active{transform:translateY(3px);box-shadow:0 2px 0 #0c2a2f}
.pc canvas{width:104px;height:104px;border-radius:16px;background:#0e2226aa}
.pc b{display:block;font-size:19px;letter-spacing:.06em;margin-bottom:4px}
.pc span{display:block;font-size:14px;line-height:1.35;color:#f6f0e0cc}
@media (orientation:landscape) and (max-height:520px){#place{flex-direction:row;flex-wrap:wrap}#place h2{width:100%}.pc{width:min(31vw,300px);grid-template-columns:1fr;text-align:center}.pc canvas{margin:0 auto;width:84px;height:84px}}
#skip{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:56px;height:56px;border-radius:50%;border:0;background:#0e2226cc;color:var(--cream);display:grid;place-items:center;cursor:pointer}
#skip svg{width:26px;height:26px}
#how,#mine,#big{border:0;background:#0e2226b0;color:var(--cream);font-family:inherit;font-weight:700;font-size:13px;line-height:1;letter-spacing:.12em;padding:13px 14px;border-radius:30px;cursor:pointer}
h1{position:absolute;left:16px;top:max(12px,env(safe-area-inset-top));margin:0;font-size:20px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:.4em;color:var(--ink)}
h1 svg{width:1.3em;height:1.3em}
#envs{display:flex;gap:10px;background:#0e222699;border-radius:40px;padding:6px}
#envs button{width:74px;height:52px;border-radius:30px;border:0;background:transparent;color:var(--cream);display:grid;place-items:center;cursor:pointer}
#envs button svg{width:40px;height:34px}
#envs button.on{background:var(--amber);color:var(--ink)}
#tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:min(94vw,420px);min-height:86px}
@media (orientation:landscape) and (max-height:520px){#tiles{width:min(94vw,760px)}#home{gap:8px}}
.tile{position:relative;width:86px;height:86px;border:0;border-radius:22px;padding:0;background:linear-gradient(#2a6a6c,#1b4e55);box-shadow:0 6px 0 #0c2a2f,inset 0 2px 0 #ffffff22;cursor:pointer;overflow:hidden}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 #0c2a2f}
.tile canvas{position:absolute;inset:0;width:100%;height:100%}
.tile b{position:absolute;right:4px;top:4px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--amber);color:var(--ink);font-size:13px;line-height:22px;text-align:center}
.tile b:empty{display:none}
#empty{width:100%;display:grid;place-items:center;height:96px;border:2px dashed #ffffff44;border-radius:22px;background:transparent;color:var(--cream);cursor:pointer}
#empty svg{width:54px;height:54px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-6px)}}
#bar{display:flex;gap:22px;align-items:center}
.row.tg{grid-template-columns:1fr}
.rb{width:58px;height:58px;border-radius:50%;border:0;background:#ffffff1a;color:var(--cream);display:grid;place-items:center;cursor:pointer}
.rb svg{width:28px;height:28px}
.rb:active{background:#ffffff33}
.rb.off{opacity:.45}
#all svg{width:46px;height:46px}
#all{width:100px;height:100px;background:var(--amber);color:var(--ink);box-shadow:0 5px 0 #a8791f}
#all:active{transform:translateY(3px);box-shadow:0 2px 0 #a8791f;background:var(--amber)}
#x{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));width:48px;height:48px;border-radius:50%;border:0;background:#0e2226aa;color:var(--cream);display:grid;place-items:center;cursor:pointer}
#x svg{width:22px;height:22px}
#setup{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#0e2226;padding:max(14px,env(safe-area-inset-top)) 16px 40px;user-select:text;-webkit-user-select:text}
#setup .in{max-width:560px;margin:0 auto}
#setup header{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0e2226;padding:6px 0 10px;z-index:1}
#setup h2{margin:0;font-size:22px}
#setup h3{margin:22px 0 6px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
#setup p{margin:4px 0 0;font-size:14px;line-height:1.45;color:#f6f0e0bb}
#sx{border:0;border-radius:24px;background:var(--amber);color:var(--ink);font-family:inherit;font-weight:700;font-size:16px;line-height:1;padding:13px 22px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff18}
.row label{display:flex;gap:12px;align-items:center;font-size:16px;min-height:44px;cursor:pointer}
.row input{width:26px;height:26px;accent-color:#f2b84b;flex:none}
.row.offr .st,.row.offr select{opacity:.35}
.st{display:flex;align-items:center;gap:2px}
.st button{width:38px;height:38px;border-radius:50%;border:0;background:#ffffff1a;color:var(--cream);font-size:20px;cursor:pointer}
.st b{min-width:30px;text-align:center;font-size:16px}
#setup select{height:38px;min-width:0;border-radius:10px;border:0;background:#ffffff1a;color:var(--cream);font:inherit;font-size:15px;padding:0 8px;max-width:100%}
#setup select option{color:#111}
</style>
</head>

<video id="vid" playsinline muted autoplay></video>
<audio id="song" preload="none"></audio>
<canvas id="cv"></canvas>

<div id="home">

  <div id="envs">
    <button data-env="bed" aria-label="In bed"><svg viewBox="0 0 40 34" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8v20M4 22h32v6M36 22v-3a4 4 0 0 0-4-4H16v7"/><circle cx="10" cy="16" r="3"/></svg></button>
    <button data-env="chair" aria-label="In a chair"><svg viewBox="0 0 40 34" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16h16v10M12 20v10"/></svg></button>
    <button data-env="stand" aria-label="Standing with support"><svg viewBox="0 0 40 34" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="22" cy="6" r="3"/><path d="M22 11v10l-3 10M22 21l3 10M22 13l-9 4M13 14v17M8 17h10"/></svg></button>
  </div>
  <div id="tiles"></div>
  <div id="bar">
    <button class="rb" id="cfg" style="order:0" aria-label="Exercise sheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.8h6V4M8.5 10l1.5 1.5 2.5-3M8.5 16l1.5 1.5 2.5-3M15 11h1M15 17h1"/></svg></button>
    <button class="rb" id="where" style="order:3" aria-label="Where is the phone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18h2"/></svg></button>
    <button class="rb" id="help" style="order:2" aria-label="How to play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9a3 3 0 1 1 4.6 2.5c-1 .7-1.6 1.3-1.6 2.5"/><circle cx="12" cy="18" r=".6" fill="currentColor"/></svg></button>
    <button class="rb" id="all" style="order:1" aria-label="Play all"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12.5-7.5a1 1 0 0 0 0-1.8L8.5 3.6A1 1 0 0 0 7 4.5z"/></svg></button>
  </div>
</div>
<div id="title" hidden><button id="go">START</button><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button id="big" class="t2">BIG SCREEN</button><button id="mine" class="t2">MY EXERCISES</button><button id="how" class="t2">HOW TO PLAY</button></div></div>
<div id="place" hidden>
  <h2>WHERE IS THE PHONE?</h2>
  <button class="pc" data-p="leg"><canvas></canvas><div><b>ON MY LEG</b><span>Hold it flat on your thigh. It feels your leg move. You can see it and tap it.</span></div></button>
  <button class="pc" data-p="prop"><canvas></canvas><div><b>PROPPED UP</b><span>Lean it up, 3 big steps away. Arms and voice run it. No touching.</span></div></button>
  <button class="pc" data-p="help"><canvas></canvas><div><b>SOMEONE HOLDS IT</b><span>They point the back camera at you and tap for you.</span></div></button>
</div>
<button id="skip" hidden aria-label="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5v14l9-7zM13 5v14l9-7z"/></svg></button>
<div id="setup" hidden></div>
<button id="x" hidden aria-label="Stop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

module.exports = QRBitBuffer;

        [6, 24, 50, 76, 102, 128, 154],
        [6, 28, 54, 80, 106, 132, 158],
        [6, 32, 58, 84, 110, 136, 162],
        [6, 26, 54, 82, 110, 138, 166],
        [6, 30, 58, 86, 114, 142, 170]
    ],

    G15 : (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
    G18 : (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
    G15_MASK : (1 << 14) | (1 << 12) | (1 << 10)    | (1 << 4) | (1 << 1),

    getBCHTypeInfo : function(data) {
        var d = data << 10;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
            d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) ) );    
        }
        return ( (data << 10) | d) ^ QRUtil.G15_MASK;
    },

    getBCHTypeNumber : function(data) {
        var d = data << 12;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
            d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) ) );    
        }
        return (data << 12) | d;
    },

    getBCHDigit : function(data) {

        var digit = 0;

        while (data !== 0) {
            digit++;
            data >>>= 1;
        }

        return digit;
    },

    getPatternPosition : function(typeNumber) {
        return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1];
    },

    getMask : function(maskPattern, i, j) {
        
        switch (maskPattern) {
            
        case QRMaskPattern.PATTERN000 : return (i + j) % 2 === 0;
        case QRMaskPattern.PATTERN001 : return i % 2 === 0;
        case QRMaskPattern.PATTERN010 : return j % 3 === 0;
        case QRMaskPattern.PATTERN011 : return (i + j) % 3 === 0;
        case QRMaskPattern.PATTERN100 : return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 === 0;
        case QRMaskPattern.PATTERN101 : return (i * j) % 2 + (i * j) % 3 === 0;
        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;
        case QRMaskPattern.PATTERN111 : return ( (i * j) % 3 + (i + j) % 2) % 2 === 0;

            throw new Error("bad maskPattern:" + maskPattern);
        }
    },

    getErrorCorrectPolynomial : function(errorCorrectLength) {

        var a = new QRPolynomial([1], 0);

        for (var i = 0; i < errorCorrectLength; i++) {
            a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0) );

        return a;

        if (1 <= type && type < 10) {

            // 1 - 9

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 10;
            case QRMode.MODE_ALPHA_NUM  : return 9;
            case QRMode.MODE_8BIT_BYTE  : return 8;
            case QRMode.MODE_KANJI      : return 8;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 27) {

            // 10 - 26

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 12;
            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 10;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 41) {

            // 27 - 40

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 14;
            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 12;
            default :
                throw new Error("mode:" + mode);
            }

        } else {
            throw new Error("type:" + type);
        }
    },

    getLostPoint : function(qrCode) {
        
        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

module.exports = QRUtil;

		this.setupPositionProbePattern(0, this.moduleCount - 7);

		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );

	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");

	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);

    pebbles(cy + r + u * 9);

    if (G.id === 'flex' && kinds.length) { const cw = Math.min(W * .9 / kinds.length, u * 30), x0 = W / 2 - cw * (kinds.length - 1) / 2, y = cy + r + u * 30; kinds.forEach((kd, i) => { const x = x0 + i * cw; c.fillStyle = '#f6f0e014'; c.beginPath(); c.roundRect(x - cw * .46, y - u * 11, cw * .92, u * 27, u * 2.5); c.fill(); c.save(); c.translate(x, y - u); c.rotate(-Math.PI / 2); bug(kd, Math.min(cw * .9, u * 19)); c.restore(); c.fillStyle = C.cream; c.textAlign = 'center'; c.font = `italic ${Math.max(9, Math.min(cw * .125, u * 3))}px Georgia,serif`; c.fillText(TAXA[kd], x, y + u * 12.6); c.font = `700 ${u * 3.4}px system-ui`; c.fillStyle = C.amber; c.fillText('×' + G.got[kd], x + cw * .3, y - u * 7); }); }

/* ---------- big screen + phones: one creek, several bodies ----------
   The big screen (TV, laptop) opens a room and shows a code to scan. Each phone that scans it becomes one player's
   camera: it reads that body, shows that player the placement mirror, and sends a small skeleton, the movement
   signal and the rep count five times a second. The big screen draws everyone in the same creek, makes the sound,
   and says the set-up out loud. Rooms go through the relay the Thunder Rigs page already uses. */
const WORKER = 'https://beflix-call.hartswf0.workers.dev', PCOL = ['#f2b84b', '#7ee081', '#6fb7ff', '#ff8fb3', '#c9a0ff', '#ffffff'];
const NPTS = [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28, 31, 32];
const NET = { room: '', id: '', seq: 0, on: false, busy: 0, err: 0, state: '' };
const roomUrl = op => `${WORKER}/trig/${encodeURIComponent(NET.room)}/${op}`;
async function jf(url, body, ms = 8000) { const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), ms); try { const r = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl.signal } : { signal: ctl.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); } finally { clearTimeout(tm); } }
async function netJoin(room, name) { NET.room = room; NET.state = 'joining'; try { const j = await jf(roomUrl('join'), { name, color: '#f2b84b' }); NET.id = j.peerId; NET.seq = j.seq || 0; NET.on = true; NET.state = 'ok'; } catch (e) { NET.state = 'fail'; throw e; } }
function netSend(msg) { if (!NET.on || NET.busy > 2) return; NET.busy++; jf(roomUrl('send'), { peerId: NET.id, msg }, 5000).catch(() => {}).finally(() => NET.busy--); }   // never queue more than three: a stale skeleton is worth nothing
function netPoll(onMsg, every) { if (!NET.on) return; jf(roomUrl('poll') + `?peerId=${encodeURIComponent(NET.id)}&after=${NET.seq}`, null, 6000).then(d => { NET.err = 0; NET.state = 'ok'; NET.seq = Math.max(NET.seq, d.seq || 0); (d.messages || []).forEach(e => { if (e && e.from !== NET.id && e.msg) onMsg(e.from, e.msg); }); }).catch(() => { if (++NET.err > 4) NET.state = 'fail'; }).finally(() => setTimeout(() => netPoll(onMsg, every), NET.err ? 1200 : every)); }
function netLeave() { if (NET.on) { NET.on = false; jf(roomUrl('leave'), { peerId: NET.id }, 3000).catch(() => {}); } }

/* a phone that scanned the code: this player's camera */
let SENSOR = false, myNum = -1, sendT = 0;
async function sensorStart() {
  PLACE = 'prop';
  $('title').hidden = true; audio(); wake(); SENSOR = true; newGame('free'); st = 'load'; xBtn.hidden = false;
  say('Lean the phone up, about waist high, facing you. Take three big steps back. Then watch the big screen.');
  netJoin(Q.get('join'), 'PHONE').then(() => netPoll((from, m) => { if (m.type === 'tv' && m.num && m.num[NET.id] != null) myNum = m.num[NET.id]; }, 1500)).catch(() => {});
  if (!SIM) { try { await Promise.all([startCam(), loadPose()]); } catch (e) { NET.cam = 'fail'; } }
  st = 'intro';
}
function sensorSend() {
  let pts = null;
  if (lm) { const v = lm.filter(p => p.visibility > .4); if (v.length > 3) { const xs = v.map(p => p.x * asp), ys = v.map(p => p.y), span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)), cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2;
    const A = G.nav || (G.nav = { s: span, x: cx, y: cy }); A.s += (span - A.s) * .2; A.x += (cx - A.x) * .25; A.y += (cy - A.y) * .25;
    pts = NPTS.flatMap(i => vis(i) ? [Math.round((lm[i].x * asp - A.x) / A.s * 1000), Math.round((lm[i].y - A.y) / A.s * 1000)] : [9999, 9999]); } }
  netSend({ type: 'p', ok: seen('free') ? 1 : 0, pts, s: +clamp(G.sd).toFixed(2), h: G.hold > 0 ? 1 : 0, j: NPTS.indexOf(G.side), n: G.n, f: framing() });
}

/* the big screen */
const TV = { pl: {}, order: [], total: 0, cre: [], fx: [], url: '', qr: null, tell: 0, mile: 0 };
const tvActive = () => TV.order.map(id => TV.pl[id]).filter(p => T - p.last < 5);
async function tvStart() {
  $('title').hidden = true; home.hidden = true; xBtn.hidden = false; audio(); ambient(true); music(true); wake(); newGame('free'); st = 'tv';
  const code = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(16).padStart(2, '0')).join('');
  TV.url = location.origin + location.pathname + '?join=' + code; try { TV.qr = window.ThunderQRCodeMatrix(TV.url, 'M'); } catch (e) { TV.qr = null; }

}
function tvMsg(from, m) {

    say(`Player ${p.i + 1} joined. Lean your phone up, about waist high, facing you. Take three big steps back. When your figure here turns bright, move an arm or a leg, and hold it.`); }
  Object.assign(p, { last: T, pts: m.pts, s: m.s, h: m.h, j: m.j, ok: m.ok, f: m.f });
  if (m.ok && !p.was) { p.was = true; say(`Player ${p.i + 1}, I can read you. Move, and hold.`); }
  if (m.n > p.n) { const k = Math.min(3, m.n - p.n); p.n = m.n; for (let q = 0; q < k; q++) tvRep(p); } else p.n = m.n;

}
function tvTick(dt) { TV.fx.forEach(f => f.t += dt); TV.fx = TV.fx.filter(f => f.t < 1.4); if ((TV.tell -= dt) <= 0) { TV.tell = 2; const num = {}; TV.order.forEach(id => num[id] = TV.pl[id].i); netSend({ type: 'tv', num }); } }
function drawQR(x, y, size) { c.fillStyle = '#fff'; c.beginPath(); c.roundRect(x, y, size, size, size * .05); c.fill(); if (!TV.qr) return; const m = TV.qr, n = m.length, q = 3, cell = size / (n + q * 2); c.fillStyle = '#0e2226'; for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (m[r][k]) c.fillRect(x + (k + q) * cell, y + (r + q) * cell, cell + .6, cell + .6); }
function netBones(p, bx, by, h, col) {
  const pt = i => { const k = NPTS.indexOf(i); return k < 0 || !p.pts || p.pts[k * 2] === 9999 ? null : [bx - p.pts[k * 2] / 1000 * h, by + p.pts[k * 2 + 1] / 1000 * h]; }, lw = Math.max(4, h * .028);
  p.P = pt; c.lineCap = 'round'; c.lineJoin = 'round';
  [1.9, 1].forEach(k => BONES.forEach(([a, b]) => { const A = pt(a), Bp = pt(b); if (!A || !Bp) return; c.lineWidth = lw * k; c.strokeStyle = k > 1 ? '#0e2226' : p.ok ? col : '#f6f0e077'; c.beginPath(); c.moveTo(...A); c.lineTo(...Bp); c.stroke(); }));
  const hd = pt(0), a = pt(11), b = pt(12); if (hd && a && b) { const r = Math.max(lw * 1.4, Math.hypot(a[0] - b[0], a[1] - b[1]) * .2); c.fillStyle = '#0e2226'; c.beginPath(); c.arc(hd[0], hd[1], r + lw * .45, 0, TAU); c.fill(); c.fillStyle = p.ok ? col : '#f6f0e077'; c.beginPath(); c.arc(hd[0], hd[1], r, 0, TAU); c.fill(); }
  const j = pt(NPTS[p.j]); if (j && p.s > .12) { c.fillStyle = p.h || p.s >= 1 ? '#7ee081' : '#fff'; c.beginPath(); c.arc(j[0], j[1], lw * (1 + p.s * 1.6), 0, TAU); c.fill(); }
}
function sceneTV() {
  const wy = H * .3, bed = H * .88, act = tvActive(), N = act.length, f = (px, w = 700) => `${w} ${px}px ui-rounded,system-ui,sans-serif`; creek(wy, bed);
  TV.cre.forEach((n, i) => { const a = T * (.25 + (i % 4) * .05) + n * 2.1, k = n % 4, x = W * (.5 + Math.cos(a) * (.34 + (i % 3) * .05)), y = lerp(wy + u * 10, bed - u * 8, (n * 37 % 10) / 10) + Math.sin(a * 2) * u * 2; c.save();
    if (k === 2) { c.translate(W * ((n * .23) % .8 + .1) + Math.sin(T + n) * u * 3, wy * (.35 + (n % 3) * .18) + Math.sin(T * 2.2 + n) * u * 3); c.rotate(-.35); dun(u * 9, Math.abs(Math.sin(T * 22 + n))); }
    else if (k === 3) { c.translate(W * ((n * .31) % .84 + .08), bed + u * 3); sprite(n, n * 5 + T * .5, u * 17); }
    else { c.translate(x, y); if (Math.sin(a) > 0) c.scale(-1, 1); k ? minnow(u * 9, T * 12 + n) : trout(u * 22, T * 6 + n); } c.restore(); });
  c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.lineJoin = 'round';
  const out = (txt, x, y, px, col, w) => { c.font = f(px, w); c.lineWidth = px * .22; c.strokeStyle = '#0e2226'; c.strokeText(txt, x, y); c.fillStyle = col; c.fillText(txt, x, y); };
  act.forEach((p, k) => { const bx = W * (k + 1) / (N + 1), h = Math.min(H * .46, W / (N + 1) * .9), by = H * .55, col = PCOL[p.i % PCOL.length];
    if (p.pts) netBones(p, bx, by, h, col);
    out(`P${p.i + 1}   ${p.reps}`, bx, by + h * .62 + u * 5, u * 6, col, 800);
    if (!p.ok) out(FRAME_WORD[p.f] || 'STEP INTO VIEW', bx, by - h * .6, u * 4.4, C.red, 800); });
  TV.fx.forEach(fx => { const q = fx.p.P && fx.p.P(NPTS[fx.j]); if (!q) return; ripples(q[0], q[1], fx.t / 1.4); drops(q[0], q[1], fx.t, 9, .9); });
  if (N) { out(String(TV.total), W / 2, u * 17, u * 15, C.cream, 800); const q = Math.min(W, H) * .17; drawQR(W - q - u * 3, H - q - u * 3, q); out('SCAN TO JOIN', W - q / 2 - u * 3, H - q - u * 5, u * 2.6, C.cream, 800); }
  else { c.fillStyle = '#0e2226d0'; c.fillRect(0, 0, W, H); const land = W > H * 1.1, q = land ? Math.min(H * .62, W * .36) : Math.min(W * .7, H * .4), qx = land ? W * .27 - q / 2 : W / 2 - q / 2, qy = land ? H * .52 - q / 2 : H * .1;
    drawQR(qx, qy, q); out('SCAN TO JOIN', qx + q / 2, qy - u * 3, u * 5.4, C.amber, 800);
    const lines = ['1   POINT A PHONE CAMERA AT THE CODE', '2   LEAN THE PHONE UP, WAIST HIGH', '3   TAKE 3 BIG STEPS BACK', '4   MOVE AN ARM OR A LEG. HOLD IT.'], px = land ? Math.min(u * 4.4, W * .024) : Math.min(u * 4, W * .044), lx = land ? W * .5 : W * .06, ly = land ? H * .36 : qy + q + u * 12;
    c.textAlign = 'left'; lines.forEach((ln, i) => { c.font = f(px, 800); c.fillStyle = i === Math.floor(T / 2.5) % 4 ? C.amber : C.cream; c.fillText(ln, lx, ly + i * px * 2.1); }); c.font = f(px * .8); c.fillStyle = '#f6f0e0aa'; c.fillText('EACH PHONE IS ONE PLAYER.  EVERYONE MENDS THE SAME CREEK.', lx, ly + 4.4 * px * 2.1, land ? W * .46 : W * .88); c.textAlign = 'center'; }
  if (NET.state === 'fail') out('NO CONNECTION', W / 2, H * .96, u * 4, C.red, 800);

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now; T += dt;
  try {
    if (camOn || SIM) { if (st !== 'load') detect(now); hands(now); }
    const how3 = st === 'howto' && HW.i === 5, b = st === 'tv' ? 1 - Math.exp(-TV.total / (14 * Math.max(1, tvActive().length))) : how3 ? clamp(HW.t / 4) : st === 'howto' ? 0 : Q.get('health') != null ? +Q.get('health') : baseHealth(), part = st === 'home' || st === 'howto' || st === 'title' ? 0 : clamp((sessDone + (st === 'done' ? 0 : clamp(G.px / reps()))) / sessTotal);
    HEALTH += (b + (1 - b) * .75 * part - HEALTH) * (1 - Math.exp(-dt * (how3 ? 6 : 1.5))); PUSH = (st === 'play' || st === 'show') && G.lost < 1 ? clamp(G.sd, 0, 1) : 0;
    update(dt); draw(); soundFrame(dt); $('skip').hidden = !(PLACE !== 'prop' && !SENSOR && (st === 'show' || st === 'intro' || st === 'play' || st === 'done'));
  } catch (e) { console.error(e); }      // one bad frame must not stop the session
  requestAnimationFrame(frame);
}

/* ---------- home + exercise sheet ---------- */

  document.querySelectorAll('#envs button').forEach(b => b.classList.toggle('on', b.dataset.env === S.env));
  box.innerHTML = ids.length ? ids.map(id => `<button class="tile" data-g="${id}" aria-label="${EX[id].name}"><canvas></canvas><b>${log[id] || ''}</b></button>`).join('')

$('cfg').onclick = openSetup;

  const el = $('setup'), row = id => { const x = S.ex[id], t = EX[id].sig === 'timer'; return `<div class="row${x.on ? '' : ' offr'}" data-id="${id}"><label><input type="checkbox"${x.on ? ' checked' : ''}>${EX[id].name}</label><span class="st"><button data-d="-1" aria-label="Fewer">−</button><b>${x.reps}</b><button data-d="1" aria-label="More">+</button></span>${t ? '<span></span>' : `<select aria-label="Movement size"><option value="1"${x.size === 1 ? ' selected' : ''}>Small</option><option value="2"${x.size === 2 ? ' selected' : ''}>Medium</option><option value="3"${x.size === 3 ? ' selected' : ''}>Large</option></select>`}</div>`; };

    ${ENVS.map(env => `<h3>${ENVN[env]}</h3>` + IDS.filter(id => EX[id].env === env).map(row).join('')).join('')}
    <h3>Sound</h3>

    <div class="row tg"><label><input type="checkbox" data-k="snd"${S.snd ? ' checked' : ''}>Creek sounds and movement tone</label></div>
